name: iso

# Builds the patina live image with live-build in a Debian container on both
# architectures, boots each image in QEMU (the automated half of the release gate in
# iso/README.md), and attaches the images to the GitHub release of a tag only when every
# boot test passed; an alpha tag gets the amd64 image only, the one whose manual install
# check passed. Pull requests that touch the image run the build and the boot test but
# never publish. Each boot test leaves a screenshot of the installer screen in its
# artifact; the one under docs/screenshots/ is copied from there.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'iso/**'
      - 'branding/**'
      - 'manifest/bundles/base.yaml'
      - '.github/workflows/iso-build.yml'
  push:
    tags: ['v*']

# A newer push to the same branch cancels the run it supersedes; tag runs never overlap.
concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    container:
      image: debian:13
      options: --privileged   # debootstrap and the chroot stages need it
    steps:
      - name: Install live-build, librsvg, the fonts, git and the Go yq
        run: |
          apt-get update -q
          # librsvg and the fonts render the installer's artwork (iso/live/assets.sh)
          apt-get install -y -q live-build debootstrap git ca-certificates curl \
            librsvg2-bin fonts-adobe-sourcesans3 fonts-jetbrains-mono fonts-sora
          curl -fsSL --retry 4 -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${{ matrix.arch }}"
          chmod +x /usr/local/bin/yq
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # git describe needs the tags
      - name: Build the image
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          iso/live/build.sh "${{ matrix.arch }}" "$GITHUB_WORKSPACE/iso/build/live"
      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iso-build-log-${{ matrix.arch }}
          path: iso/build/live/build.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: patina-${{ matrix.arch }}
          path: iso/build/live/*.iso
          if-no-files-found: error

  boot-test:
    name: boot test (${{ matrix.arch }}, QEMU)
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            packages: qemu-system-x86 ovmf
          - arch: arm64
            runner: ubuntu-24.04-arm
            packages: qemu-system-arm qemu-efi-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: patina-${{ matrix.arch }}
          path: image
      - name: Install QEMU, the UEFI firmware and bsdtar
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ${{ matrix.packages }} libarchive-tools
          # KVM where the runner has it; boot-test.sh falls back to TCG where it does not.
          if [[ -e /dev/kvm ]]; then sudo chmod a+rw /dev/kvm; fi
      - name: Boot the image
        env:
          PATINA_TEST_ARCH: ${{ matrix.arch }}
        run: iso/test/boot-test.sh image/*.iso "$RUNNER_TEMP/boot-test"
      - name: Keep the serial log and the screenshot of the installer screen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/boot-test/boot.log
            ${{ runner.temp }}/boot-test/installer-*.png
          if-no-files-found: ignore

  release:
    name: publish to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: boot-test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Alpha tags carry the amd64 image only: it passed its manual install check, the
      # arm64 one has not yet and stays in CI.
      IMAGES: ${{ contains(github.ref_name, '-alpha') && 'patina-amd64' || 'patina-*' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.IMAGES }}
          path: image
          merge-multiple: true
      - name: Create the tag's release as a draft, with its section of CHANGELOG.md as notes
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          # The section ends at the next heading; the link references below it stay out.
          awk -v head="## [$version]" '
            /^## \[/ { if (on) exit; on = index($0, head) == 1; next }
            on && !/^\[[^]]*\]: /' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [[ -s "$RUNNER_TEMP/notes.md" ]] || {
            echo "CHANGELOG.md has no section for $version"
            exit 1
          }
          flags=(--draft --title "patina $tag" --notes-file "$RUNNER_TEMP/notes.md")
          # A version with a pre-release part (0.1.0-alpha.1, 0.1.0-rc.1) is a pre-release.
          if [[ "$version" == *-* ]]; then flags+=(--prerelease); fi
          gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" "${flags[@]}"
      - name: Upload the images and their checksums
        run: |
          (cd image && sha256sum -- *.iso > SHA256SUMS)
          gh release upload "$GITHUB_REF_NAME" image/*.iso image/SHA256SUMS --clobber
