name: iso

# Builds the patina21 live image with live-build in a Debian container on both
# architectures, boots each image in QEMU (the automated half of the release gate in
# iso/README.md), and attaches the images to the GitHub release of a tag only when every
# boot test passed. Pull requests that touch the image run the build and the boot test
# but never publish.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'iso/**'
      - 'branding/**'
      - 'manifest/bundles/base.yaml'
      - '.github/workflows/iso-build.yml'
  push:
    tags: ['v*']

# A newer push to the same branch cancels the run it supersedes; tag runs never overlap.
concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    container:
      image: debian:13
      options: --privileged   # debootstrap and the chroot stages need it
    steps:
      - name: Install live-build, git and the Go yq
        run: |
          apt-get update -q
          apt-get install -y -q live-build debootstrap git ca-certificates curl
          curl -fsSL --retry 4 -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${{ matrix.arch }}"
          chmod +x /usr/local/bin/yq
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # git describe needs the tags
      - name: Build the image
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          iso/live/build.sh "${{ matrix.arch }}" "$GITHUB_WORKSPACE/iso/build/live"
      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iso-build-log-${{ matrix.arch }}
          path: iso/build/live/build.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: patina21-${{ matrix.arch }}
          path: iso/build/live/*.iso
          if-no-files-found: error

  boot-test:
    name: boot test (${{ matrix.arch }}, QEMU)
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            packages: qemu-system-x86 ovmf
          - arch: arm64
            runner: ubuntu-24.04-arm
            packages: qemu-system-arm qemu-efi-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: patina21-${{ matrix.arch }}
          path: image
      - name: Install QEMU, the UEFI firmware and bsdtar
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ${{ matrix.packages }} libarchive-tools
          # KVM where the runner has it; boot-test.sh falls back to TCG where it does not.
          if [[ -e /dev/kvm ]]; then sudo chmod a+rw /dev/kvm; fi
      - name: Boot the image
        env:
          PATINA_TEST_ARCH: ${{ matrix.arch }}
        run: iso/test/boot-test.sh image/*.iso "$RUNNER_TEMP/boot-test"
      - name: Keep the serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-log-${{ matrix.arch }}
          path: ${{ runner.temp }}/boot-test/boot.log
          if-no-files-found: ignore

  release:
    name: attach to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: boot-test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: patina21-*
          path: image
          merge-multiple: true
      - name: Upload the images to the tag's release (created as a draft if missing)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" > /dev/null 2>&1 \
            || gh release create "$tag" --draft --title "$tag" --notes ""
          gh release upload "$tag" image/*.iso --clobber
