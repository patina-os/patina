name: iso

# Builds the patina21 live image with live-build in a Debian container, boots it in QEMU
# (the automated half of the release gate in iso/README.md), and attaches it to the
# GitHub release of a tag only when that boot test passed. amd64 only until Phase 3.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: debian:13
      options: --privileged   # debootstrap and the chroot stages need it
    steps:
      - name: Install live-build, git and the Go yq
        run: |
          apt-get update -q
          apt-get install -y -q live-build debootstrap git ca-certificates curl
          curl -fsSL --retry 4 -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /usr/local/bin/yq
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # git describe needs the tags
      - name: Build the image
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          iso/live/build.sh amd64 "$GITHUB_WORKSPACE/iso/build/live"
      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iso-build-log
          path: iso/build/live/build.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: patina21-amd64
          path: iso/build/live/*.iso
          if-no-files-found: error

  boot-test:
    name: boot test (amd64, QEMU)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: patina21-amd64
          path: image
      - name: Install QEMU, UEFI firmware and bsdtar
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 ovmf libarchive-tools
          sudo chmod a+rw /dev/kvm
      - name: Boot the image
        run: iso/test/boot-test.sh image/*.iso "$RUNNER_TEMP/boot-test"
      - name: Keep the serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-log
          path: ${{ runner.temp }}/boot-test/boot.log
          if-no-files-found: ignore

  release:
    name: attach to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: boot-test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: patina21-amd64
          path: image
      - name: Upload the image to the tag's release (created as a draft if missing)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" > /dev/null 2>&1 \
            || gh release create "$tag" --draft --title "$tag" --notes ""
          gh release upload "$tag" image/*.iso --clobber
