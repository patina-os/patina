name: lint

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck every script
        run: |
          # Scripts are recognised by the shebang the conventions require (CLAUDE.md).
          files=()
          while IFS= read -r f; do
            if [[ "$(head -n1 "$f" 2>/dev/null)" == '#!/usr/bin/env bash' ]]; then
              files+=("$f")
            fi
          done < <(git ls-files)
          printf 'checking: %s\n' "${files[@]}"
          # -x follows the `source` of bin/lib.sh (the scripts carry a source= directive).
          shellcheck -x --shell=bash "${files[@]}"

  yamllint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: yamllint every YAML file
        run: |
          command -v yamllint >/dev/null || pipx install yamllint
          yamllint .

  consistency:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: The installer installs every package of manifest/bundles/base.yaml
        run: |
          # The image must leave a system on which `patina` runs at first boot, so every
          # package of the base bundle is in the list Calamares installs.
          packages=iso/live/config/includes.chroot/etc/calamares/modules/packages.conf
          missing=0
          for pkg in $(yq eval '.packages[]' manifest/bundles/base.yaml); do
            if ! yq eval -e ".operations[].install[]? | select(. == \"$pkg\")" \
                "$packages" > /dev/null; then
              echo "missing in $packages: $pkg"
              missing=1
            fi
          done
          exit "$missing"
      - name: Bundle descriptions fit an 80-column terminal
        run: |
          # The bundle question prints "  • <name 9> (<kind>) <description>": 23 columns
          # before the description; the AI question "  <mode 6> <description>": 9. gum
          # cuts what does not fit. Characters, not bytes: the descriptions use "·".
          export LC_ALL=C.UTF-8
          long=0
          for f in manifest/bundles/*.yaml; do
            d="$(yq eval '.description' "$f")"
            max=56
            yq eval -e '.ai' "$f" > /dev/null 2>&1 && max=70
            if [[ ${#d} -gt $max ]]; then
              echo "$f: the description has ${#d} characters, at most $max fit"
              long=1
            fi
          done
          exit "$long"
      - name: The installer's yq bootstrap matches the recipe in manifest/upstream.yaml
        run: |
          # yq cannot read its own recipe, so bin/patina-install carries the URL once more.
          url="$(yq eval '.yq.url' manifest/upstream.yaml)"
          grep -qF "\"$url\"" bin/patina-install || {
            echo "bin/patina-install does not fetch $url"
            exit 1
          }
      - name: The login screen's font is the font of defaults/settings.yaml
        run: |
          # SDDM reads a static file under /etc, so the font name is copied once, here.
          font="$(yq eval '.fonts.ui' defaults/settings.yaml)"
          grep -q "^Font=$font," defaults/system/sddm.conf.d/patina.conf || {
            echo "defaults/system/sddm.conf.d/patina.conf does not set Font=$font"
            exit 1
          }
      - name: A device is detected by its own DMI fields and no others
        run: |
          # Each device's detect map, written out as a fake /sys/class/dmi/id, detects
          # that device alone; a QEMU machine of its own (Standard PC) detects none.
          export PATINA_PATH="$PWD"
          for f in devices/[a-z]*/device.yaml; do
            yq eval -e '.detect | length > 0' "$f" > /dev/null 2>&1 || continue
            dmi="$(mktemp -d)"
            yq eval '.detect | to_entries | .[] | .key + "\t" + .value' "$f" |
              while IFS=$'\t' read -r key value; do echo "$value" > "$dmi/$key"; done
            got="$(PATINA_DMI="$dmi" bash -c 'source bin/lib.sh; detected_devices')"
            [[ "$got" == "$(basename "$(dirname "$f")")" ]] || { echo "$f detects: $got"; exit 1; }
          done
          dmi="$(mktemp -d)"
          echo 'Standard PC (Q35 + ICH9, 2009)' > "$dmi/product_name"
          echo QEMU > "$dmi/sys_vendor"
          got="$(PATINA_DMI="$dmi" bash -c 'source bin/lib.sh; detected_devices')"
          [[ -z "$got" ]] || { echo "a plain QEMU machine detects: $got"; exit 1; }
      - name: The mark and the wordmark have exactly one copy each
        run: |
          # Scripts print branding/logo.txt and wordmark.txt; nothing else may carry
          # them (CLAUDE.md, "Never"). docs/design/ keeps design pages as they were
          # shown, the marks included.
          status=0
          for mark in branding/logo.txt branding/wordmark.txt; do
            line="$(sed -n 2p "$mark")"
            copies="$(git grep -l -F "$line" -- . ':!branding/' ':!docs/design/' \
              || true)"
            if [[ -n "$copies" ]]; then
              echo "$mark copied into: $copies"
              status=1
            fi
          done
          exit "$status"
