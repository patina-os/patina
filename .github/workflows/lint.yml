name: lint

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck every script
        run: |
          # Scripts are recognised by the shebang the conventions require (CLAUDE.md).
          files=()
          while IFS= read -r f; do
            if [[ "$(head -n1 "$f" 2>/dev/null)" == '#!/usr/bin/env bash' ]]; then
              files+=("$f")
            fi
          done < <(git ls-files)
          printf 'checking: %s\n' "${files[@]}"
          shellcheck --shell=bash "${files[@]}"

  yamllint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: yamllint every YAML file
        run: |
          command -v yamllint >/dev/null || pipx install yamllint
          yamllint .

  consistency:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: The logo copy on the ISO console matches branding/logo.txt
        run: cmp branding/logo.txt iso/kiwi/root/etc/issue.d/10-patina21.issue
      - name: The installer's mandatory packages cover manifest/bundles/base.yaml
        run: |
          # The ISO must leave a system on which `patina` runs at first boot, so every
          # package of the base bundle is mandatory in the Agama product definition.
          product=iso/kiwi/root/usr/share/agama/products.d/patina21.yaml
          missing=0
          for pkg in $(yq eval '.packages[]' manifest/bundles/base.yaml); do
            if ! yq eval -e ".software.mandatory_packages[] | select(. == \"$pkg\")" \
                "$product" > /dev/null; then
              echo "missing in $product: $pkg"
              missing=1
            fi
          done
          exit "$missing"
      - name: The Agama profiles are valid JSON
        run: |
          for f in iso/agama/*.json iso/test/*.json; do
            jq empty "$f" || { echo "invalid JSON: $f"; exit 1; }
          done
