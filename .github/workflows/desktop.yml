name: desktop

# The finished desktop as pictures, from Path A: `patina install` as a user in a stock
# Debian 13 container with Plasma, then desktops/plasma/screenshot.sh runs a Plasma X11
# session on a virtual framebuffer (Xvfb, software OpenGL, no GPU and no login), applies
# the theme inside it and grabs kitty with the greeting, KRunner on the agent's answer
# through kortex, and the start menu in the light mode. The pictures are uploaded as an
# artifact; the ones under docs/screenshots/ are copied from there, never edited. amd64
# only: the smoke workflow proves the layer on arm64 as well, and the desktop looks the
# same.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktops/**'
      - 'themes/**'
      - 'defaults/**'
      - 'branding/**'
      - 'manifest/bundles/desktop.yaml'
      - 'manifest/bundles/ai-cloud.yaml'
      - '.github/workflows/desktop.yml'

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  screenshot:
    name: screenshot (amd64, Plasma on a virtual framebuffer)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: debian:13
      options: --privileged   # flatpak's bubblewrap sandbox, as in the smoke workflow
    steps:
      - name: Install Plasma and what Path A starts from
        # Plasma as Debian ships it (the X11 session and its window manager) with the
        # apps the bar pins (Dolphin, Firefox), the virtual framebuffer and Mesa's
        # software renderer a session needs without a GPU or a login manager, and scrot
        # for the grab. git and curl are what the README asks for; sudo is the user's
        # way to apt.
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q \
            plasma-desktop plasma-workspace kwin-x11 xvfb scrot \
            dolphin firefox-esr dbus libgl1-mesa-dri libegl-mesa0 \
            git ca-certificates curl sudo
      - uses: actions/checkout@v5
      - name: A user for the layer, with sudo for apt
        run: |
          useradd --create-home --shell /bin/bash patina
          echo 'patina ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/patina
          chown -R patina:patina "$GITHUB_WORKSPACE"
          # No systemd here, so no system bus. flatpak asks AccountsService over it
          # whether a user may install an app, and skips the check only when the bus
          # answers that no such service exists; root (the smoke workflow) is not asked.
          mkdir -p /run/dbus
          dbus-daemon --system --fork
      - name: patina install, as that user
        # Path A as on a laptop: the backend's sudo is used, not dropped. The default
        # bundle and the cloud agent, which brings opencode and kortex without a local
        # model's gigabytes. The agents and artcraft bundles stay out, as by default:
        # the command palette's picture asks the agent for PhotoCraft, which comes with
        # artcraft.
        run: |
          sudo -u patina -H env PATINA_AI=cloud \
            bin/patina install --unattended --bundles desktop
      - name: The desktop as pictures
        # The command palette's picture needs an answer, and CI has no model to give
        # one: kortex's scripted demo model (docs/demo/demo_llm.py at a fixed commit,
        # the one that recorded kortex's README animation) stands in for the cloud
        # provider in opencode's configuration. It answers a request to install
        # PhotoCraft by asking to run `patina install --bundles artcraft`, which waits
        # for Allow once, Always or Deny. Everything else is real: kortex, opencode serve and
        # KRunner. Into the user's home: a path the upload step reads unchanged inside
        # the container, which the runner's temp directory is not.
        env:
          DEMO_MODEL: https://raw.githubusercontent.com/patina-os/kortex/04878415fa59b92c490454ec393008300c8a72f4/docs/demo/demo_llm.py
        run: |
          mkdir -p /opt/kortex-demo
          curl -fsSL -o /opt/kortex-demo/demo_llm.py "$DEMO_MODEL"
          sudo -u patina -H python3 -I -c 'import sys; sys.path.insert(0, "/opt/kortex-demo")
          import demo_llm, http.server
          http.server.ThreadingHTTPServer(("127.0.0.1", 8090), demo_llm.Handler).serve_forever()' \
            > /home/patina/demo-model.log 2>&1 &
          model=$!
          trap 'kill "$model"' EXIT
          sudo -u patina -H env PATH="/home/patina/.local/bin:$PATH" yq -i -o=json '
            .provider.demo = {"npm": "@ai-sdk/openai-compatible", "name": "kortex demo model",
              "options": {"baseURL": "http://127.0.0.1:8090/v1", "apiKey": "demo"},
              "models": {"demo": {"name": "demo", "tool_call": true}}} |
            .model = "demo/demo" | .small_model = "demo/demo"
          ' /home/patina/.config/opencode/opencode.json
          sudo -u patina -H env PATINA_SHOT_ASK='install photocraft' \
            desktops/plasma/screenshot.sh /home/patina/shots
      - name: Keep the screenshots and the session's log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-amd64
          path: /home/patina/shots/
          if-no-files-found: error
