name: desktop

# The finished desktop as a picture, from Path A: `patina install` as a user in a stock
# Debian 13 container with Plasma, then desktops/plasma/screenshot.sh runs a Plasma
# session on a virtual screen (no GPU, no display, no login), applies the theme inside
# it, opens kitty with the greeting and takes one screenshot through KWin. The picture
# is uploaded as an artifact; the one under docs/screenshots/ is copied from there,
# never edited. amd64 only: the smoke workflow proves the layer on arm64 as well, and
# the desktop looks the same.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktops/**'
      - 'themes/**'
      - 'defaults/**'
      - 'branding/**'
      - 'manifest/bundles/desktop.yaml'
      - '.github/workflows/desktop.yml'

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  screenshot:
    name: screenshot (amd64, Plasma on a virtual screen)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: debian:13
      options: --privileged   # flatpak's bubblewrap sandbox, as in the smoke workflow
    steps:
      - name: Install Plasma and what Path A starts from
        # Plasma as Debian ships it with the apps the bar pins (Dolphin, Firefox), what
        # a session needs without a login manager (a session bus, Mesa's software
        # renderer) and Spectacle for the picture. git and curl are what the README
        # asks for; sudo is the user's way to apt.
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q \
            plasma-desktop plasma-workspace kwin-wayland kscreen spectacle \
            dolphin firefox-esr dbus libgl1-mesa-dri libegl-mesa0 \
            git ca-certificates curl sudo
      - uses: actions/checkout@v5
      - name: A user for the layer, with sudo for apt
        run: |
          useradd --create-home --shell /bin/bash patina
          echo 'patina ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/patina
          chown -R patina:patina "$GITHUB_WORKSPACE"
          mkdir -p "$RUNNER_TEMP/desktop"
          chown patina:patina "$RUNNER_TEMP/desktop"
      - name: patina install, as that user
        # Path A as on a laptop: the backend's sudo is used, not dropped. The agents
        # bundle stays out, as by default.
        run: sudo -u patina -H bin/patina install --unattended
      - name: The desktop as a picture
        run: |
          sudo -u patina -H desktops/plasma/screenshot.sh "$RUNNER_TEMP/desktop/desktop-amd64.png"
      - name: Keep the screenshot and the session's log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-amd64
          path: |
            ${{ runner.temp }}/desktop/desktop-amd64.png
            ${{ runner.temp }}/desktop/desktop-amd64.png.log
          if-no-files-found: error
