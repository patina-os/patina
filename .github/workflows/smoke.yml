name: smoke

# Path A in a stock Debian 13 container on both architectures the layer targets:
# `patina install` unattended, twice (the second run must change nothing), then
# `patina doctor`. Also checks that every package the manifest, the devices and the
# image name exists in Debian's archive.

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  smoke:
    name: smoke (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            deb_arch: amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    container:
      image: debian:13
      # flatpak runs its post-install triggers in a bubblewrap sandbox, which needs
      # namespaces the default container profile forbids.
      options: --privileged
    steps:
      - name: Install what Path A starts from
        # The README asks for git and curl; a stock Debian desktop has them, the bare
        # container does not. A Plasma desktop also has kwriteconfig6 (every KDE app
        # depends on it), which the theme renderer writes settings with, and Breeze's
        # desktop theme (plasma-desktoptheme), whose popups the renderer grains.
        run: |
          apt-get update -q
          apt-get install -y -q git ca-certificates curl libkf6config-bin plasma-desktoptheme
      - uses: actions/checkout@v5
      - name: Show the base
        run: |
          uname -m
          grep PRETTY_NAME /etc/os-release
      - name: Run the entry point
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bin/patina version
          bin/patina help
          bin/patina install --list
      - name: patina install, first run
        # As root: the backend's sudo is dropped; curl, flatpak and the rest come from
        # the base bundle; yq is fetched by the installer itself. The AI agent with a
        # cloud model: opencode from npm and its configuration, no login and no
        # multi-gigabyte local model in CI.
        env:
          PATINA_AI: cloud
        run: |
          bin/patina install --unattended
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"   # GITHUB_PATH applies from the next step
          model="$(yq eval '.ai.cloud.providers[0].model' defaults/settings.yaml)"
          [[ "$(yq eval -r '.model' "$HOME/.config/opencode/opencode.json")" == "$model" ]]
          yq eval -e '.instructions[] | select(. == "*/defaults/agent.md")' \
            "$HOME/.config/opencode/opencode.json"
          [[ "$(cat "$HOME/.local/state/patina/ai")" == cloud ]]
          # kortex, the agent in KRunner, from its tagged release
          test -f "$HOME/.local/share/kortex/kortex.py"
          test -f "$HOME/.local/share/krunner/dbusplugins/kortex.desktop"
          ref="$(yq eval '.kortex.ref' manifest/upstream.yaml)"
          [[ "$(cat "$HOME/.local/state/patina/upstream/kortex")" == "$ref" ]]
          python3 "$HOME/.local/share/kortex/kortex.py" --version
      - name: patina install, second run changes nothing
        # No PATINA_AI: the answer the first run recorded is taken.
        run: |
          bin/patina install --unattended | tee second-run.txt
          grep -q 'patina: nothing to do' second-run.txt
      - name: patina doctor reports clean
        run: |
          bin/patina doctor
          bin/patina migrate --list
      - name: The theme rendered and switches without leftovers
        # `patina install` applied the default theme; setting it again changes nothing.
        # A copy of it under another name stands in for a second theme pack: the
        # renderer takes it without a code change, and switching back removes it.
        run: |
          theme="$(yq eval '.theme' defaults/settings.yaml)"
          wallpaper="$(basename "$(yq eval '.wallpapers[0]' "themes/$theme/theme.yaml")")"
          wallpaper="${wallpaper%.*}"
          data="$HOME/.local/share"
          scheme() { kreadconfig6 --file kdeglobals --group General --key ColorScheme; }
          [[ "$(bin/patina theme current)" == "$theme" ]]
          bin/patina theme list
          test -s "$data/color-schemes/patina-$theme.colors"
          test -s "$data/wallpapers/patina-$theme-$wallpaper/contents/images/3840x2160.png"
          test -s "$data/plasma/look-and-feel/org.patina.$theme/contents/defaults"
          grep -q 'org.kde.plasma.icontasks' \
            "$data/plasma/look-and-feel/org.patina.$theme/contents/layouts/org.kde.plasma.desktop-layout.js"
          [[ "$(kreadconfig6 --file kwinrc --group Windows --key Placement)" == Centered ]]
          [[ "$(scheme)" == "patina-$theme" ]]
          launch="$(kreadconfig6 --file kglobalshortcutsrc --group services \
            --group kitty.desktop --key _launch)"
          [[ "$launch" == Meta+Return ]]
          bin/patina theme set "$theme" | tee again.txt
          grep -q 'terminal: nothing to do' again.txt
          grep -q 'theme: nothing to do' again.txt
          cp -r "themes/$theme" themes/zz-copy
          sed -i "s/^name: $theme/name: zz-copy/" themes/zz-copy/theme.yaml
          bin/patina theme set zz-copy
          test -s "$data/color-schemes/patina-zz-copy.colors"
          test ! -e "$data/color-schemes/patina-$theme.colors"
          test ! -e "$HOME/.config/btop/themes/patina-$theme.theme"
          [[ "$(scheme)" == "patina-zz-copy" ]]
          bin/patina theme set "$theme"
          rm -r themes/zz-copy
          test ! -e "$data/color-schemes/patina-zz-copy.colors"
          test ! -e "$data/wallpapers/patina-zz-copy-$wallpaper"
          test ! -e "$HOME/.config/nvim/colors/patina-zz-copy.lua"
          [[ "$(scheme)" == "patina-$theme" ]]
      - name: The colours, the icons, the start menu, its grain and the windows rendered
        # The scheme's colours are in kdeglobals (where Plasma reads them, not only in
        # the scheme file), the icon theme of the theme carries its folders in the
        # accent and its glyphs at one height, the start menu has its button, folders
        # and favourites, the popups their glass, light rim and faint selection, the
        # glyphs the accent, and no window an opacity rule (only kitty is see-through,
        # by its own background).
        run: |
          theme="$(yq eval '.theme' defaults/settings.yaml)"
          t="themes/$theme/theme.yaml"
          data="$HOME/.local/share"
          rgb() { printf '%d,%d,%d' "0x${1:1:2}" "0x${1:3:2}" "0x${1:5:2}"; }
          window="$(kreadconfig6 --file kdeglobals --group Colors:Window --key BackgroundNormal)"
          [[ "$window" == "$(rgb "$(yq eval '.palette.base01' "$t")")" ]]
          wm="$(kreadconfig6 --file kdeglobals --group WM --key activeBackground)"
          [[ "$wm" == "$window" ]]
          [[ "$(kreadconfig6 --file kdeglobals --group Icons --key Theme)" == "patina-$theme" ]]
          accent="$(yq eval '.palette[.accent]' "$t")"
          grep -qi "$accent" "$data/icons/patina-$theme/64x64/places/folder.svg"
          test -s "$HOME/.local/state/patina/launcher.svg"
          layout="$data/plasma/look-and-feel/org.patina.$theme/contents/layouts/org.kde.plasma.desktop-layout.js"
          grep -qF "$HOME/.local/state/patina/launcher.svg" "$layout"
          test -s "$HOME/.config/menus/applications-merged/patina-start-menu.menu"
          for id in $(yq eval '.start_menu.folders[].id' defaults/settings.yaml); do
            test -s "$data/desktop-directories/patina-$id.directory"
          done
          prepend="$(kreadconfig6 --file kicker-extra-favoritesrc --group General --key Prepend)"
          [[ "$prepend" == *thunderbird.desktop* ]]
          glyph="$data/icons/patina-$theme/32x32/symbolic/apps/kitty.svg"
          test -s "$glyph"
          grep -q '<svg viewBox=' "$glyph"
          grep -q '<svg viewBox=' "$HOME/.local/state/patina/launcher.svg"
          # The apps' glyphs keep the text colour; the start menu's categories take the
          # accent. (A negated command does not stop a step under set -e, hence the if.)
          if grep -qiE "$accent|ColorScheme-Accent" "$glyph"; then exit 1; fi
          categories="$data/icons/patina-$theme/32x32/symbolic/categories"
          grep -qliE "$accent|ColorScheme-Accent" "$categories"/*.svg
          rules="$(kreadconfig6 --file kwinrulesrc --group General --key rules)"
          [[ "$rules" != *patina-window-opacity* ]]
          [[ "$(kreadconfig6 --file plasmarc --group Theme --key name)" == "patina-$theme" ]]
          # Captured before grep: grep -q stops at the first match, and with pipefail
          # zcat's SIGPIPE would fail the step.
          background="$(zcat "$data/plasma/desktoptheme/patina-$theme/dialogs/background.svgz")"
          grep -q '<image' <<< "$background"
          glass="$data/plasma/desktoptheme/patina-$theme/translucent/dialogs/background.svgz"
          glass="$(zcat "$glass")"
          grep -q "opacity:0.$(yq eval '.start_menu.glass' defaults/settings.yaml)" <<< "$glass"
          rim="$(printf '0.%02d' "$(yq eval '.start_menu.rim' defaults/settings.yaml)")"
          grep -q "opacity=\"$rim\"" <<< "$glass"
          viewitem="$data/plasma/desktoptheme/patina-$theme/widgets/viewitem.svgz"
          viewitem="$(zcat "$viewitem")"
          grep -q 'id="hover-center"' <<< "$viewitem"
          selection="$(printf '0.%02d' "$(yq eval '.start_menu.selection' defaults/settings.yaml)")"
          grep -q "opacity=\"$selection\"" <<< "$viewitem"
          test -s "$data/plasma/desktoptheme/patina-$theme/metadata.json"
      - name: The light mode switches and switches back
        # The default theme carries a light palette: the mode turns the terminal and the
        # wallpaper light, the splash and the login screen stay dark, a second run
        # changes nothing, and the dark mode leaves no light wallpaper behind.
        run: |
          theme="$(yq eval '.theme' defaults/settings.yaml)"
          t="themes/$theme/theme.yaml"
          data="$HOME/.local/share"
          dark_bg="$(yq eval -e '.palette.base00' "$t")"
          light_bg="$(yq eval -e '.light.palette.base00' "$t")"
          light_wp="$(basename "$(yq eval -e '.light.wallpapers[0]' "$t")")"
          light_wp="$data/wallpapers/patina-$theme-${light_wp%.*}"
          splash="$data/plasma/look-and-feel/org.patina.$theme/contents/splash/Splash.qml"
          login="$(sha256sum < /usr/local/share/patina/login.png)"
          [[ "$(bin/patina theme mode)" == dark ]]
          bin/patina theme mode light
          [[ "$(bin/patina theme mode)" == light ]]
          grep -qx "background $light_bg" "$HOME/.config/kitty/patina.conf"
          test -s "$light_wp/contents/images/3840x2160.png"
          grep -q "color: \"$dark_bg\"" "$splash"
          [[ "$(sha256sum < /usr/local/share/patina/login.png)" == "$login" ]]
          out="$(bin/patina theme mode light)"
          grep -q 'terminal: nothing to do' <<< "$out"
          grep -q 'theme: nothing to do' <<< "$out"
          bin/patina theme mode dark
          grep -qx "background $dark_bg" "$HOME/.config/kitty/patina.conf"
          test ! -e "$light_wp"
      - name: The terminal and its tools rendered
        # desktops/terminal/: kitty carries the palette, btop and neovim get their own
        # files, and neovim loads the colour scheme when nothing else chose one.
        run: |
          theme="$(yq eval '.theme' defaults/settings.yaml)"
          config="$HOME/.config"
          grep -qxF 'include patina.conf' "$config/kitty/kitty.conf"
          grep -q "^color13 $(yq eval '.palette.base0E' "themes/$theme/theme.yaml")" \
            "$config/kitty/patina.conf"
          test -s "$config/btop/themes/patina-$theme.theme"
          btop_theme="$config/btop/themes/patina-$theme.theme"
          test -s "$btop_theme"
          grep -qxF "color_theme = \"$btop_theme\"" "$config/btop/btop.conf"
          test -s "$config/bat/config"
          test -s "$config/environment.d/60-patina.conf"
          if grep -rq '\${' "$config/kitty" "$config/btop/themes" "$config/nvim"; then
            exit 1   # a placeholder the renderer did not fill
          fi
          colors="$(nvim --headless +'lua io.write(vim.g.colors_name)' +qa 2>&1)"
          [[ "$colors" == "patina-$theme" ]]
      - name: The login screen, the splash and the terminal greeting rendered
        run: |
          theme="$(yq eval '.theme' defaults/settings.yaml)"
          data="$HOME/.local/share"
          test -s /usr/local/share/patina/login.png
          splash="$data/plasma/look-and-feel/org.patina.$theme/contents/splash"
          test -s "$splash/Splash.qml"
          test -s "$splash/images/logo.png"
          ! grep -q '\${' "$splash/Splash.qml"
          ksplash="$(kreadconfig6 --file ksplashrc --group KSplash --key Theme)"
          [[ "$ksplash" == "org.patina.$theme" ]]
          variant="$(kreadconfig6 --file kcm-about-distrorc --group General --key Variant)"
          [[ "$variant" == *"patina credits"* ]]
          test -s "$HOME/.local/state/patina/logo.txt"
          test -s "$HOME/.config/fastfetch/config.jsonc"
      - name: The cheat sheet, the credits, and a theme installed from git
        # A local repository stands in for a community theme: install keeps only its
        # data, set renders it, remove refuses the current theme and deletes it after.
        run: |
          data="$HOME/.local/share"
          theme="$(yq eval '.theme' defaults/settings.yaml)"
          # Output is captured before grep: grep -q stops at the first match, and with
          # pipefail the writer's SIGPIPE would fail the step.
          out="$(bin/patina keys)"
          grep -q 'Show these keys' <<< "$out"
          out="$(bin/patina credits)"
          grep -q 'Debian' <<< "$out"
          test -s "$data/applications/patina-keys.desktop"
          launch="$(kreadconfig6 --file kglobalshortcutsrc --group services \
            --group patina-keys.desktop --key _launch)"
          [[ "$launch" == Meta+K ]]
          repo="$(mktemp -d)/patina-dusk-theme"
          cp -r themes/datum "$repo"
          sed -i 's/^name: datum/name: dusk/' "$repo/theme.yaml"
          echo 'echo not data' > "$repo/run.sh"
          git -C "$repo" init -q
          git -C "$repo" add -A
          git -C "$repo" -c user.email=ci@patina -c user.name=ci commit -qm theme
          bin/patina theme install "file://$repo"
          test -s "$HOME/.config/patina/themes/dusk/theme.yaml"
          test ! -e "$HOME/.config/patina/themes/dusk/run.sh"
          out="$(bin/patina theme list)"
          grep -q '^  dusk .*installed' <<< "$out"
          out="$(bin/patina theme install "file://$repo")"
          grep -q 'up to date' <<< "$out"
          bin/patina theme set dusk
          if bin/patina theme remove dusk; then exit 1; fi
          bin/patina theme set "$theme"
          bin/patina theme remove dusk
          test ! -e "$HOME/.config/patina/themes/dusk"
      - name: The image's assets render from the theme
        # What iso/live/build.sh renders before lb, without root or live-build: the
        # installer's marks, artwork and stylesheet, the boot menu's theme and splash.
        run: |
          theme="$(yq eval '.theme' defaults/settings.yaml)"
          build="$(mktemp -d)"
          cp -r iso/live/config "$build/"
          iso/live/assets.sh "$build"
          b="$build/config/includes.chroot/etc/calamares/branding/patina"
          for f in welcome.png logo-square.png icon-small.svg wallpaper.png slide-1.png \
              slide-2.png slide-3.png slide-4.png slide-5.png slide-6.png stylesheet.qss \
              ai-local.png ai-cloud.png ai-none.png language.png help.png bugs.png release.png \
              about.png; do
            test -s "$b/$f"
          done
          test -s "$build/config/includes.chroot/etc/fonts/local.conf"
          test -s "$build/config/bootloaders/grub-pc/splash.png"
          test -s "$build/config/bootloaders/grub-pc/live-theme/theme.txt"
          test -s "$build/config/includes.chroot/usr/share/themes/patina/openbox-3/themerc"
          test -s "$build/config/includes.chroot/etc/issue.d/10-patina.issue"
          chooser="$build/config/includes.chroot/etc/calamares/modules/packagechooser-ai.conf"
          [[ "$(yq eval '.default' "$chooser")" == "$(yq eval '.ai.mode' defaults/settings.yaml)" ]]
          current="$(yq eval '.style.SidebarTextCurrent' "$b/branding.desc")"
          accent="$(yq eval '.accent // "base0E"' "themes/$theme/theme.yaml")"
          [[ "$current" == "$(yq eval ".palette.$accent" "themes/$theme/theme.yaml")" ]]
      - name: What landed
        run: |
          yq --version
          flatpak list --user --columns=application,version
          ls -l /etc/apt/sources.list.d /etc/apt/keyrings
          cat "$HOME/.local/state/patina/bundles"
          cat "$HOME/.local/state/patina/theme"
      - name: Every YAML file parses
        run: |
          git ls-files '*.yaml' '*.yml' '*.conf' '*.desc' \
            ':!defaults/system/' ':!devices/*/system/*' ':!desktops/*/templates/*' |
          while read -r f; do
            yq eval '.' "$f" > /dev/null || { echo "invalid YAML: $f"; exit 1; }
          done
      - name: Every package the bundles, the devices and the image name exists in Debian
        # A dry run resolves names and dependencies without installing anything.
        run: |
          # The container's sources carry main only; the image also uses non-free-firmware.
          sed -i 's/^Components: main$/Components: main non-free-firmware/' \
            /etc/apt/sources.list.d/debian.sources
          apt-get update -q
          mapfile -t pkgs < <(iso/test/list-packages.sh "${{ matrix.deb_arch }}")
          printf 'resolving %d packages\n' "${#pkgs[@]}"
          apt-get install --dry-run -y -q "${pkgs[@]}" > /dev/null
