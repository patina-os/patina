<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${SELECT_WIDTH}" height="${SELECT_HEIGHT}" viewBox="${SELECT_VIEWBOX}">
  <!-- The boot menu's selected entry: a bar of the accent, as faint as the installer's
       current step (its sidebar's SidebarBackgroundCurrent), with a fine outline and
       round corners. Drawn as one square of 2r+1 pixels, r the corners' radius;
       render_boot_menu (bin/lib.sh) cuts it by viewBox into GRUB's nine pieces
       (select_nw.png ... select_se.png), whose corners GRUB keeps as they are and whose
       edges and middle it stretches round the entry. -->
  <rect x="1" y="1" width="${SELECT_INNER}" height="${SELECT_INNER}" rx="${SELECT_ROUND}"
        fill="${ACCENT}" fill-opacity="0.14" stroke="${ACCENT}" stroke-opacity="0.6" stroke-width="2"/>
</svg>
