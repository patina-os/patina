# Services the AI agent can work with, as MCP servers: presets, off until `patina ai
# connect <name>` turns one on. Each has a line for the list, how it signs in and
# opencode's entry for it (`mcp.<name>` in ~/.config/opencode/opencode.json). A
# browser sign-in leaves the tokens with opencode (`opencode mcp auth`); a token asked
# for on the terminal is kept in ~/.config/patina/services/<name>.token, readable by
# the user only, and the entry names that file (`{file:...}`), so the token is in no
# configuration. `ask` lists the other values the terminal asks for; ${TOKEN_FILE}
# and ${<KEY>} fill the entry. Linear, Notion and GitHub are US services, never on by
# default.
linear:
  description: Linear · issues and projects
  sign_in: browser
  opencode:
    type: remote
    url: https://mcp.linear.app/mcp
notion:
  description: Notion · pages and databases
  sign_in: browser
  opencode:
    type: remote
    url: https://mcp.notion.com/mcp
github:
  description: GitHub · repositories, issues and pull requests
  sign_in: token
  token: >-
    a fine-grained personal access token, made at
    https://github.com/settings/personal-access-tokens
  opencode:
    type: remote
    url: https://api.githubcopilot.com/mcp/
    oauth: false
    headers:
      Authorization: Bearer {file:${TOKEN_FILE}}
nextcloud:
  # A community server (nextcloud-mcp-server, AGPL-3.0), run by uv from PyPI; Nextcloud
  # makes none of its own. Calendar and tasks, notes, files, contacts, Deck and more.
  description: Nextcloud · calendar and tasks, notes, files, contacts
  sign_in: token
  token: an app password, made in your Nextcloud under Settings › Security
  ask:
    - key: HOST
      prompt: Your Nextcloud's address (https://...)
    - key: LOGIN
      prompt: Your Nextcloud user name
  opencode:
    type: local
    command: [uvx, nextcloud-mcp-server, run, --transport, stdio]
    environment:
      NEXTCLOUD_HOST: ${HOST}
      NEXTCLOUD_USERNAME: ${LOGIN}
      NEXTCLOUD_PASSWORD: '{file:${TOKEN_FILE}}'
