# Settings `patina install` merges into applications' own configuration files, as data.
# Per app: `requires`, the flatpak ID or upstream key that must be part of the install
# for the settings to apply; `file`, the JSON file the app reads (~ is the home
# directory; a Flatpak's configuration lives under ~/.var/app/<id>/config); `settings`,
# the keys merged into it, so the user's other settings stay. A file yq cannot parse
# (Zed writes comments into a settings.json the user has opened) is left alone with a
# warning that names the keys.
zed:
  requires:
    flatpak: dev.zed.Zed
  file: ~/.var/app/dev.zed.Zed/config/zed/settings.json
  settings:
    telemetry:
      diagnostics: false
      metrics: false
    disable_ai: true
opencode:
  # The agent of the AI bundles and the agents bundle. Ollama as the local provider: the
  # OpenAI-compatible endpoint on this machine and the model Ollama's own opencode guide
  # names. Which model opencode uses, the model that fits this machine's memory and the
  # instructions (defaults/agent.md) come from the AI step of `patina install`, which
  # knows the answer to its question. Permissions: reading runs freely, anything that
  # changes files or runs a command (ssh to a server included) asks first; a few
  # read-only commands are allowed. The last matching rule wins, so "*" comes first.
  requires:
    upstream: opencode
  file: ~/.config/opencode/opencode.json
  settings:
    $schema: https://opencode.ai/config.json
    provider:
      ollama:
        npm: "@ai-sdk/openai-compatible"
        name: Ollama (local)
        options:
          baseURL: http://localhost:11434/v1
        models:
          "qwen3.5":
            name: qwen3.5
    permission:
      edit: ask
      webfetch: allow
      external_directory: ask
      bash:
        "*": ask
        "cat *": allow
        "df *": allow
        "free *": allow
        "git diff*": allow
        "git log*": allow
        "git status*": allow
        "ls*": allow
        "lsblk*": allow
        "patina doctor*": allow
        "patina keys*": allow
        "patina theme list*": allow
        "systemctl status *": allow
        "uname *": allow
