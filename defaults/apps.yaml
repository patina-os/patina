# Settings `patina install` merges into applications' own configuration files, as data.
# Per app: `requires`, the flatpak ID or upstream key that must be part of the install
# for the settings to apply; `file`, the JSON file the app reads (~ is the home
# directory; a Flatpak's configuration lives under ~/.var/app/<id>/config); `settings`,
# the keys merged into it, so the user's other settings stay. A file yq cannot parse
# (Zed writes comments into a settings.json the user has opened) is left alone with a
# warning that names the keys.
zed:
  requires:
    flatpak: dev.zed.Zed
  file: ~/.var/app/dev.zed.Zed/config/zed/settings.json
  settings:
    telemetry:
      diagnostics: false
      metrics: false
    disable_ai: true
opencode:
  # The agent of the AI bundles and the agents bundle. Ollama as the local provider: the
  # OpenAI-compatible endpoint on this machine and the model Ollama's own opencode guide
  # names. Which model opencode uses, the model that fits this machine's memory and the
  # instructions (defaults/agent.md) come from the AI step of `patina install`, which
  # knows the answer to its question.
  #
  # Permissions: anything that changes files, runs a command (ssh to a server included)
  # or fetches a web page asks first. What runs without asking:
  # - opencode's own read, list and file-name search (glob) tools, but not on the files
  #   that hold a secret (`read`): the agent's and the services' tokens, everything in
  #   ~/.ssh but its public parts, password databases and wallets, the logins of git,
  #   netrc, cloud and container tools and browsers. With a cloud model, what the agent
  #   reads goes to its provider. Its content search (`grep`) asks: opencode matches a
  #   grep rule against the search term, not the files, and does not hold the `read`
  #   rules against what it finds, so a search for "ghp_" printed a token unasked
  #   (opencode 1.19; a rule by path needs a change upstream).
  # - Reading under the system's own directories (`external_directory`); a change
  #   there still asks, as an edit or a command does.
  # - Commands that only look (`bash`): a diagnosis of a dozen steps asked a dozen
  #   times, and a user who has clicked Allow that often no longer reads the row that
  #   matters. None of them prints a file's content (no cat, head, grep: they would
  #   read the secrets `read` keeps back) or the environment, and none takes an
  #   option that writes a file (git log --output does, so it is not here). "x *"
  #   also matches a bare "x"; a rule without the space ("id*") matches other commands.
  # A rule taken out of this list stays in a file written before, after the redirect
  # rule, where it would allow its command with a redirect: rename or drop one only
  # with a migration that removes it ("lsblk*" keeps its name for that reason), or turn
  # it to ask ("kreadconfig6 *", "ip -br *") and allow narrower forms after it.
  # The last matching rule wins, so "*" comes first and the checks last. opencode
  # matches each command of a line by itself, with its redirect, and "*" in a rule
  # matches anything, options included, so a rule allows every option of its command:
  # - "*>*" asks for a redirect: "df *" alone would also allow "df > ~/.profile".
  #   After it, a few commands are allowed again with "2>/dev/null" or "2>&1" at the
  #   end, which models add whatever the instruction says; "*>*>*" then asks for a
  #   second redirect beside it.
  # - "*<*" and "*$*" ask for what could put a file into a command's words:
  #   "echo $(<file)", or "x=$(<file); ls $x", whose first half opencode never sees.
  # - The options that read a file and print it in an error ("du --files0-from", "ip
  #   -batch", "ss -F", apt's "-o Dir::Etc::sourcelist=") or write one (journalctl's
  #   --cursor-file, ss -D), and those that show a secret (nmcli -s) or reach another
  #   machine (systemctl -H) ask. kreadconfig6 runs unasked only on Plasma's own
  #   files (a name ending in rc, or kdeglobals, without a path): with a path it
  #   reads any INI file, ~/.aws/credentials too.
  # Known gap (opencode 1.19.6): a redirect on a group or subshell is no part of the
  # command inside, so "(df -h) > file" writes without asking, and a line without a
  # command ("> file", "x=1") asks nothing whatever the rules say: opencode asks only
  # for the commands it finds (ShellTool.ask returns when there are none). It emptied
  # a file in a test run. No rule here can close either; it needs a change in opencode
  # (anomalyco/opencode#49948, closed for its new shell tool, not in 1.19.6; #64067).
  # defaults/agent.md tells the agent to write files with its edit tool, never with a
  # redirect, and to follow no instruction it reads in data.
  # A service's tools (MCP) ask through rules `patina ai connect` and `patina install`
  # write for each server in `mcp`: "<service>_*" asks, the service's `reads`
  # (defaults/services.yaml) are allowed. The first rule, "*", makes every tool no
  # other rule names ask, so a service the agent or the user adds asks from its first
  # call, before an install writes its rules (opencode allows an unnamed tool); the
  # rules after it allow opencode's own tools again.
  requires:
    upstream: opencode
  file: ~/.config/opencode/opencode.json
  settings:
    $schema: https://opencode.ai/config.json
    provider:
      ollama:
        npm: "@ai-sdk/openai-compatible"
        name: Ollama (local)
        options:
          baseURL: http://localhost:11434/v1
        models:
          "qwen3.5":
            name: qwen3.5
    permission:
      "*": ask
      # opencode's own tools that change nothing outside the conversation
      glob: allow
      list: allow
      lsp: allow
      todowrite: allow
      todoread: allow
      task: allow
      skill: allow
      question: allow
      plan_enter: allow
      edit: ask
      webfetch: ask
      grep: ask
      read:
        "*": allow
        "*.env": ask
        "*.env.*": ask
        "*.env.example": allow
        "*.token": deny
        "*.key": deny
        "*.kdbx": deny
        "*/.ssh/id_*": deny
        "*/.gnupg/*": deny
        "*/opencode/auth.json": deny
        "*/.hermes/.env": deny
        "*/.git-credentials": deny
        "*/.netrc": deny
        "*/.config/gh/hosts.yml": deny
        # every private key in ~/.ssh, whatever its name; its public parts are allowed
        "*/.ssh/*": deny
        "*/.ssh/*.pub": allow
        "*/.ssh/config": allow
        "*/.ssh/known_hosts": allow
        "*/.ssh/known_hosts.old": allow
        "*/.ssh/authorized_keys": allow
        "*.pem": ask
        "*.keyx": deny
        "*/.aws/credentials": deny
        "*/.docker/config.json": deny
        "*/.kube/config": deny
        "*/rclone.conf": deny
        "*/.pgpass": deny
        "*/.npmrc": ask
        "*/.pypirc": deny
        "*/.cargo/credentials*": deny
        "*/.config/gcloud/*": deny
        "*/logins.json": deny
        "*/key4.db": deny
        "*/cookies.sqlite": deny
        "*/Login Data": deny
        "*/Cookies": deny
        "*/.local/share/kwalletd/*": deny
        "*/.local/share/keyrings/*": deny
        "/proc/*/environ": deny
      external_directory:
        "*": ask
        "/etc/*": allow
        "/usr/*": allow
        "/proc/*": allow
        "/sys/*": allow
        "/run/*": allow
        "/var/log/*": allow
        "/var/lib/dpkg/*": allow
        "/boot/*": allow   # GRUB's menu and settings, which the user may read
      bash:
        "*": ask
        # the machine
        "df *": allow
        "du *": allow
        "free *": allow
        "lsblk*": allow
        "findmnt *": allow
        "mount": allow
        "uname *": allow
        "uptime *": allow
        "date": allow
        "hostname": allow
        "whoami": allow
        "id *": allow
        "locale *": allow
        "lscpu *": allow
        "lsusb *": allow
        "lspci *": allow
        "lsmod *": allow
        "sensors *": allow
        # files, by name and size only
        "ls *": allow
        "stat *": allow
        "pwd": allow
        "which *": allow
        "command -v *": allow
        "type *": allow
        "echo *": allow
        # what runs
        "ps *": allow
        "pgrep *": allow
        "top -bn1*": allow
        "systemctl status *": allow
        "systemctl --user status *": allow
        "systemctl is-active *": allow
        "systemctl is-enabled *": allow
        "systemctl list-units*": allow
        "systemctl list-timers*": allow
        "systemctl --failed *": allow
        "journalctl *": allow
        # the network, printing, sound, Bluetooth
        "ip addr": allow
        "ip addr show*": allow
        "ip address show*": allow
        "ip route": allow
        "ip route show*": allow
        "ip -br *": ask
        "ip -br a*": allow
        "ip -br l*": allow
        "ss *": allow
        "getent *": allow
        "ping -c *": allow
        "resolvectl status*": allow
        "nmcli": allow
        "nmcli general status*": allow
        "nmcli device status*": allow
        "nmcli device show*": allow
        "nmcli device wifi list*": allow
        "nmcli connection show*": allow
        "rfkill list*": allow
        "lpstat *": allow
        "pactl info*": allow
        "pactl list*": allow
        "wpctl status*": allow
        "bluetoothctl show*": allow
        "bluetoothctl devices*": allow
        # packages
        "dpkg -l*": allow
        "dpkg -s *": allow
        "dpkg -L *": allow
        "dpkg-query *": allow
        "apt list*": allow
        "apt policy*": allow
        "apt-cache *": allow
        "apt-get -s *": allow
        "flatpak list*": allow
        "flatpak info *": allow
        "flatpak remotes*": allow
        "flatpak history*": allow
        "flatpak remote-info *": allow
        "flatpak search *": allow
        # the boot menu
        "efibootmgr": allow
        "efibootmgr -v": allow
        "grub-editenv list": allow
        # the desktop and patina
        "kreadconfig6 *": ask
        "kreadconfig6 --file kdeglobals *": allow
        "kreadconfig6 --file *rc *": allow
        "kreadconfig6 --group *": allow
        "git status*": allow
        "patina help*": allow
        "patina version*": allow
        "patina --version": allow
        "patina -V": allow
        "patina doctor*": allow
        "patina keys*": allow
        "patina theme list*": allow
        "patina theme current*": allow
        "patina install --list*": allow
        "patina ai status*": allow
        "patina ai connect": allow
        "*>*": ask
        # the same commands with their errors hidden or kept, and nothing else redirected
        "df * 2>/dev/null": allow
        "df * 2>&1": allow
        "du * 2>/dev/null": allow
        "du * 2>&1": allow
        "free * 2>/dev/null": allow
        "free * 2>&1": allow
        "ls * 2>/dev/null": allow
        "ls * 2>&1": allow
        "stat * 2>/dev/null": allow
        "stat * 2>&1": allow
        "lsblk* 2>/dev/null": allow
        "lsblk* 2>&1": allow
        "findmnt * 2>/dev/null": allow
        "findmnt * 2>&1": allow
        "lsusb * 2>/dev/null": allow
        "lsusb * 2>&1": allow
        "lspci * 2>/dev/null": allow
        "lspci * 2>&1": allow
        "sensors * 2>/dev/null": allow
        "sensors * 2>&1": allow
        "which * 2>/dev/null": allow
        "which * 2>&1": allow
        "command -v * 2>/dev/null": allow
        "command -v * 2>&1": allow
        "journalctl * 2>/dev/null": allow
        "journalctl * 2>&1": allow
        "systemctl status * 2>/dev/null": allow
        "systemctl status * 2>&1": allow
        "systemctl --user status * 2>/dev/null": allow
        "systemctl --user status * 2>&1": allow
        "dpkg -l* 2>/dev/null": allow
        "dpkg -l* 2>&1": allow
        "dpkg -s * 2>/dev/null": allow
        "dpkg -s * 2>&1": allow
        "dpkg-query * 2>/dev/null": allow
        "dpkg-query * 2>&1": allow
        "apt list* 2>/dev/null": allow
        "apt list* 2>&1": allow
        "apt policy* 2>/dev/null": allow
        "apt policy* 2>&1": allow
        "apt-cache * 2>/dev/null": allow
        "apt-cache * 2>&1": allow
        "flatpak list* 2>/dev/null": allow
        "flatpak list* 2>&1": allow
        "flatpak info * 2>/dev/null": allow
        "flatpak info * 2>&1": allow
        "kreadconfig6 --file kdeglobals * 2>/dev/null": allow
        "kreadconfig6 --file kdeglobals * 2>&1": allow
        "kreadconfig6 --file *rc * 2>/dev/null": allow
        "kreadconfig6 --file *rc * 2>&1": allow
        "kreadconfig6 --group * 2>/dev/null": allow
        "kreadconfig6 --group * 2>&1": allow
        "git status* 2>/dev/null": allow
        "git status* 2>&1": allow
        # the checks, last
        "*>*>*": ask
        "*<*": ask
        "*$*": ask
        "du *--f*": ask
        "ss *F*": ask
        "ss *D*": ask
        "ss *--*": ask
        "apt* -o*": ask
        "apt*--option*": ask
        "journalctl *--cursor-file*": ask
        "nmcli * -s*": ask
        "nmcli *--show-secrets*": ask
        "systemctl *-H*": ask
        "systemctl *--host*": ask
        "kreadconfig6 --group *--file*": ask
        "kreadconfig6 --file */* -*": ask
        "kreadconfig6 *--file *--file*": ask
