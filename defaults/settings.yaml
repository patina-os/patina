# Defaults applied by `patina install` unless the user picks otherwise. Keep this file
# small: one knob per line, desktop-agnostic; the renderer under desktops/ translates.
theme: aurora                # a directory under themes/; PATINA_THEME=<name> overrides
mode: dark                   # dark | light, for themes that have both; patina theme mode switches
desktop: plasma              # the renderer: desktops/<desktop>/apply.sh
flatpak_remote: https://dl.flathub.org/repo/flathub.flatpakrepo
fonts:                       # font names only; the desktop bundle installs the packages
  ui: Source Sans 3          # everything the user reads
  monospace: JetBrains Mono  # terminals and details (versions, hostnames, progress)
  display: Sora              # the wordmark, and the headlines of the installer's slides
agent: opencode              # what the `agent` keybinding opens (needs an AI or the agents bundle)
# The AI agent: the question `patina install` asks after the bundles, and the page of
# the image's installer. local and cloud are the bundles manifest/bundles/ai-*.yaml name
# with their `ai` key; the answer is kept in the state directory, PATINA_AI overrides.
ai:
  mode: none                 # local | cloud | none; preselected, and taken when unattended;
                             # `patina ai on` turns the agent on later
  local:                     # Ollama on this machine: the models that fit the memory are
    models:                  # offered in this order, the first that fits is recommended
      - model: "nemotron-3.5-bolt:e4b"
        min_memory_gb: 16
        name: "Nemotron 3.5 Bolt E4B · NVIDIA · made for agents · 8 GB"
      - {model: "ministral-3:3b", min_memory_gb: 0, name: "Ministral 3 3B · Mistral · 3 GB"}
      - {model: "ministral-3:8b", min_memory_gb: 12, name: "Ministral 3 8B · Mistral · 6 GB"}
      - {model: "ministral-3:14b", min_memory_gb: 20, name: "Ministral 3 14B · Mistral · 9 GB"}
      - {model: "qwen3.5", min_memory_gb: 16, name: "Qwen 3.5 9B · Alibaba · 7 GB"}
      - {model: "qwen3.5:4b", min_memory_gb: 8, name: "Qwen 3.5 4B · Alibaba · 4 GB"}
  cloud:                     # offered in this order; `model` is opencode's provider/model,
    providers:               # without one opencode picks the provider's default
      - {id: mistral, name: "Mistral (EU · France)", model: "mistral/mistral-large-latest"}
      - {id: scaleway, name: "Scaleway (EU · France)"}
      - {id: ovhcloud, name: "OVHcloud (EU · France)"}
      - {id: stackit, name: "STACKIT (EU · Germany)"}
      - {id: anthropic, name: "Anthropic (US)", model: "anthropic/claude-sonnet-5-5"}
      - {id: openai, name: "OpenAI (US)"}
# The speed settings (docs/roadmap.md, Phase 2), after what CachyOS sets on Plasma.
speed:
  animation_speed: 0.5       # factor on the animation length; 1 is Plasma's default, 0 none
  latency: lowest            # compositor latency: lowest | low | balanced | smooth | smoothest
  file_indexing: names       # off | names | content; names means file names under home only
# Windows and the panel (the look of a Windows 11 desktop: new windows the same size in
# the middle, the launcher and the task icons in the centre of the bar).
windows:
  placement: centered        # where a new window opens: centered | smart (Plasma's own)
  size: 70                   # percent of the screen a new main window takes; 0 keeps the app's size
  opacity:                   # percent opacity of every window; 100 for both: fully opaque.
    active: 100              # Only kitty is see-through, by its own background
    inactive: 100            # (desktops/terminal/templates/kitty.conf)
panel:
  layout: centered           # centered: launcher and task icons in the middle; plasma: stock bar
  floating: false            # false: along the screen's edge, always; true: Plasma's floating bar
  pinned: [files, browser, terminal]   # actions of keybindings.yaml pinned to the bar, in order
# The command palette (KRunner on Plasma, kortex's `ai` in it).
command_palette:
  position: center           # where it opens: center of the screen | top (Plasma's own)
# The start menu (Kickoff or the Application Dashboard on Plasma): the patina mark as
# its button, AI and self-hosting first. Each folder becomes a folder of the menu and
# its apps open the favourites, in order, followed by `favorites`. Apps are desktop
# entries; favourites not installed are left out, the folders show whatever is installed.
start_menu:
  style: popup               # popup: a menu above its button | dashboard: full screen, centred
  grain: 6                   # percent of fine noise on the start menu and the other popups; 0 none
  glass: 60                  # percent opacity of the popups' background where KWin blurs behind
                             # it (Breeze: 85); lower lets more of the wallpaper glow through
  rim: 12                    # percent of the text colour in the popups' 1 px rim, a light
                             # hairline round the glass (Breeze: a darker line); 0 keeps Breeze's
  selection: 10              # percent of the accent filling the selected row of the start menu,
                             # the command palette and the other popups (Breeze: 30); its thin
                             # edge takes four times as much
  icons: accent              # the menu's category icons: accent | text; the apps' glyphs
                             # in the menu and the bar always take the text colour
  folders:
    - id: ai
      name: AI
      icon: folder-code
      apps:
        - patina-agent.desktop                         # the agent (an AI or the agents bundle)
        - claude-desktop.desktop
    - id: self-hosting
      name: Self-hosting
      icon: folder-network
      apps:
        - com.nextcloud.desktopclient.nextcloud.desktop
        - im.riot.Riot.desktop                         # Element, on your Matrix server
        - nextcloud-office-nextcloudoffice.desktop     # Euro-Office
        - thunderbird.desktop
        - org.keepassxc.KeePassXC.desktop
  favorites:
    - kitty.desktop
    - dev.zed.Zed.desktop                              # the extras bundle
    - patina-artcraft-launcher.desktop                 # the ArtCraft Launcher (the artcraft bundle)
