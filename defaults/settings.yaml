# Defaults applied by `patina install` unless the user picks otherwise. Keep this file
# small: one knob per line, desktop-agnostic; the renderer under desktops/ translates.
theme: aurora                # a directory under themes/; PATINA_THEME=<name> overrides
mode: dark                   # dark | light, for themes that have both; patina theme mode switches
desktop: plasma              # the renderer: desktops/<desktop>/apply.sh
flatpak_remote: https://dl.flathub.org/repo/flathub.flatpakrepo
fonts:                       # font names only; the desktop bundle installs the packages
  ui: Source Sans 3          # everything the user reads
  monospace: JetBrains Mono  # terminals and details (versions, hostnames, progress)
  display: Sora              # the wordmark, and the headlines of the installer's slides
agent: opencode              # what the `agent` keybinding opens (needs an AI or the agents bundle)
# The AI agent: the question `patina install` asks after the bundles, and the page of
# the image's installer. local and cloud are the bundles manifest/bundles/ai-*.yaml name
# with their `ai` key; the answer is kept in the state directory, PATINA_AI overrides.
ai:
  agent: opencode            # opencode | hermes; the agent preselected, and taken unattended
  mode: none                 # local | cloud | none; preselected, and taken when unattended;
                             # `patina ai on` turns the agent on later
  local:                     # Ollama on this machine: the models that fit the memory are
    # offered in this order, the first that fits is recommended. A model under 14B
    # parameters is `small`: it gets commands and facts wrong more often, so the model
    # question shows `small_hint` beside it, and the install and `patina ai` say
    # `small_note` after its name
    small_hint: "small, more mistakes"
    small_note: >-
      is a small model: it gets commands and facts wrong more often than a large one,
      so read what it proposes before you allow it (ministral-3:14b, from 20 GB of
      memory, or a cloud provider errs less)
    models:
      - model: "nemotron-3.5-bolt:e4b"
        min_memory_gb: 16
        name: "Nemotron 3.5 Bolt E4B · NVIDIA · made for agents · 8 GB"
        small: true
      - {model: "ministral-3:3b", min_memory_gb: 0, small: true,
         name: "Ministral 3 3B · Mistral · 3 GB"}
      - {model: "ministral-3:8b", min_memory_gb: 12, small: true,
         name: "Ministral 3 8B · Mistral · 6 GB"}
      - {model: "ministral-3:14b", min_memory_gb: 20, name: "Ministral 3 14B · Mistral · 9 GB"}
      - {model: "qwen3.5", min_memory_gb: 16, name: "Qwen 3.5 9B · Alibaba · 7 GB", small: true}
      - {model: "qwen3.5:4b", min_memory_gb: 8, name: "Qwen 3.5 4B · Alibaba · 4 GB", small: true}
  # The cloud providers, offered in this order by `patina ai login` (and the welcome's
  # step that runs it; the install asks none of this). `model` is opencode's
  # provider/model, which every entry but `custom` needs: without one opencode took the
  # first model it knew, Ollama's, which a cloud agent does not have. `login` is how the
  # agent gets in: key (the default) through opencode's own login or a key in Hermes' own
  # .env; none, nothing to log in to; endpoint, the address of an OpenAI-compatible API
  # and its key, and a model from the list that API gives. Hermes offers the ones with a
  # `hermes` entry: its model entry and the key it reads from its .env. A US service
  # says so in its name, and `note` is what `patina ai login` and `patina ai` say once
  # it is picked.
  cloud:
    providers:
      - id: mistral
        name: "Mistral (EU · France)"
        model: "mistral/mistral-large-latest"
        # Hermes' model entry and the key it reads from its .env: Mistral through Hermes'
        # `custom` provider, Mistral's OpenAI-compatible API
        hermes:
          key: MISTRAL_API_KEY
          model: {provider: custom, default: mistral-large-latest,
                  base_url: "https://api.mistral.ai/v1", api_key: "${MISTRAL_API_KEY}"}
      - {id: scaleway, name: "Scaleway (EU · France)", model: "scaleway/mistral-medium-3.5-128b"}
      - {id: ovhcloud, name: "OVHcloud (EU · France)", model: "ovhcloud/qwen3.5-397b-a17b"}
      - {id: stackit, name: "STACKIT (EU · Germany)", model: "stackit/openai/gpt-oss-120b"}
      # Your own: any OpenAI-compatible API (a company's, LiteLLM, vLLM, LM Studio). Its
      # address, key and model are what `patina ai login` asked, in the state directory
      # (ai-endpoint.yaml): opencode gets the provider `custom` of its file, Hermes its
      # `custom` provider, ${URL} and ${MODEL} filled in
      - id: custom
        name: "Your own · an OpenAI-compatible API"
        login: endpoint
        hermes:
          key: PATINA_CUSTOM_API_KEY
          model: {provider: custom, default: "${MODEL}", base_url: "${URL}",
                  api_key: "${PATINA_CUSTOM_API_KEY}"}
      # OpenCode Zen's free model, to try the agent without an account: opencode only,
      # and while it is free, what it is asked may be used to improve it
      - id: big-pickle
        name: "Big Pickle · OpenCode Zen · free, no key (US, leaves the EU)"
        model: "opencode/big-pickle"
        login: none
        note: >-
          Big Pickle runs at OpenCode Zen, a US service: what you ask leaves the EU and
          falls under US law, and while Big Pickle is free, it may be used to improve
          the model, so ask it nothing private. Its free limit is counted per network
          address: behind a shared one (an office, a university, a VPN) it may be used
          up before you ask.
      - id: anthropic
        name: "Anthropic (US, leaves the EU)"
        model: "anthropic/claude-sonnet-5-5"
        note: "Anthropic is a US service: what you ask leaves the EU and falls under US law."
        hermes: {key: ANTHROPIC_API_KEY, model: {provider: anthropic, default: claude-sonnet-5-5}}
      - id: openai
        name: "OpenAI (US, leaves the EU)"
        model: "openai/gpt-5.5"
        note: "OpenAI is a US service: what you ask leaves the EU and falls under US law."
        hermes: {key: OPENAI_API_KEY, model: {provider: openai-api, default: gpt-5.5}}
# The speed settings (docs/roadmap.md, Phase 2), after what CachyOS sets on Plasma.
speed:
  animation_speed: 0.5       # factor on the animation length; 1 is Plasma's default, 0 none
  latency: lowest            # compositor latency: lowest | low | balanced | smooth | smoothest
  file_indexing: names       # off | names | content; names means file names under home only
# Touchpads: the default for every touchpad; one set in the desktop's own settings keeps
# that choice. Mice and their wheels stay as they are.
input:
  touchpad_scrolling: natural  # natural: the content follows the fingers, as on a phone, up and
                               # down and sideways at once (libinput turns both together) |
                               # traditional: the way a mouse wheel scrolls (Plasma's default)
# Windows and the panel: new windows the same size in the middle, and the start button
# alone in the centre of the bar, so the start menu opens centred on the screen.
windows:
  placement: centered        # where a new window opens: centered | smart (Plasma's own)
  size: 70                   # percent of the screen a new main window takes; 0 keeps the app's size
  opacity:                   # percent opacity of every window; 100 for both: fully opaque.
    active: 100              # Only kitty is see-through, by its own background
    inactive: 100            # (desktops/terminal/templates/kitty.conf)
panel:
  layout: centered           # centered: the start button alone in the middle, the task icons at
                             # the left end | grouped: the start button leading the task icons
                             # in the middle, as on Windows 11 (its menu then opens left of the
                             # centre, but for start_menu.position center) | plasma: the stock bar
  floating: false            # false: along the screen's edge, always; true: Plasma's floating bar
  pinned: [files, browser, terminal]   # actions of keybindings.yaml pinned to the bar, in order
# The command palette (KRunner on Plasma, the AI agent in it through kortex).
command_palette:
  position: center           # where it opens: center of the screen | top (Plasma's own)
# The start menu (Kickoff or the Application Dashboard on Plasma): the patina mark as
# its button, AI and self-hosting first. Each folder becomes a folder of the menu and
# its apps open the favourites, in order, followed by `favorites`. Apps are desktop
# entries; favourites not installed are left out, the folders show whatever is installed.
start_menu:
  style: popup               # popup: a menu above its button | dashboard: full screen, centred
  position: button           # button: centred above its button, which the centered bar puts in
                             # the middle | center: in the middle of the screen's width with the
                             # grouped bar too, moved there by a KWin script of patina's own
  grain: 6                   # percent of fine noise on the start menu and the other popups; 0 none
  glass: 72                  # percent opacity of the popups' background where KWin blurs behind
                             # it (Breeze: 85): frosted, the wallpaper's colours glow through and
                             # its shapes do not; lower lets more of it through
  bands: 0                   # percent opacity of the band Breeze lays over the glass at the top and
                             # bottom of the start menu and the other popups (Breeze: 75, with a
                             # line against the content at 20); 0 leaves one pane, without lines
  search: 3                  # percent of the text colour veiling the search fields of the start
                             # menu, the command palette and the other popups, which have no edge
                             # but the accent's, five times as much under the pointer and ten times
                             # while typing; 0 keeps Breeze's solid field
  rim: 4                     # percent of the text colour in the popups' 1 px rim, a barely
                             # visible edge round the glass, so it reads as almost borderless
                             # (Breeze: a darker line); 0 keeps Breeze's
  selection: 10              # percent of the accent filling the selected row of the start menu,
                             # the command palette and the other popups (Breeze: 30); its thin
                             # edge takes four times as much
  icons: accent              # the menu's category icons: accent | text; the apps' glyphs
                             # in the menu and the bar always take the text colour
  folders:
    - id: ai
      name: AI
      icon: folder-code
      apps:
        - patina-ask.desktop                           # Ask kortex: the command palette on
                                                       # the agent alone, as Meta+A
                                                       # (an AI bundle)
        - patina-agent.desktop                         # the agent (an AI or the agents bundle)
        - claude-desktop.desktop
    - id: self-hosting
      name: Self-hosting
      icon: folder-network
      apps:
        - com.nextcloud.desktopclient.nextcloud.desktop
        - im.riot.Riot.desktop                         # Element, on your Matrix server
        - nextcloud-office-nextcloudoffice.desktop     # Euro-Office
        - thunderbird.desktop
        - org.keepassxc.KeePassXC.desktop
  favorites:
    - kitty.desktop
    - dev.zed.Zed.desktop                              # the headstart bundle
    - patina-artcraft-launcher.desktop                 # the ArtCraft Launcher (the artcraft bundle)
  hidden:                    # apps kept out of the menu and its search; they start when asked
    - org.kde.plasma-welcome.desktop                   # KDE's Welcome Center (patina welcome)
