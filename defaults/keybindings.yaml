# Desktop-agnostic keybindings: action name -> key chord.
# Chord syntax: modifiers Meta, Ctrl, Alt, Shift joined with '+', then the key
# (a letter, digit, F-key, Return, Space, Tab, Escape, Print, Left/Right/Up/Down).
# Renderers map each action to their desktop's own mechanism (desktops/<desktop>/) and
# warn about actions they do not know instead of failing.
# Curated: Meta plus one key for the things a day starts with, Plasma's own chord where
# it already had a good one (files, lock screen, screenshot).
actions:
  terminal: Meta+Return    # kitty
  launcher: Meta+Space     # search and run; Meta alone still opens the application menu
  browser: Meta+B          # the default web browser
  files: Meta+E            # the file manager
  agent: Meta+A            # the agent in its own terminal profile; with an AI or the agents bundle
  close-window: Meta+Q
  overview: Meta+Tab       # all windows and desktops at a glance
  lock-screen: Meta+L
  screenshot: Print
  keys: Meta+K             # these keys at a glance (`patina keys`)
# What each action does, in words, for the cheat sheet (`patina keys`, Meta+K).
names:
  terminal: Open a terminal
  launcher: Search and run
  browser: Open the web browser
  files: Open the file manager
  agent: Open the AI agent
  close-window: Close the window
  overview: Show all windows and desktops
  lock-screen: Lock the screen
  screenshot: Take a screenshot
  keys: Show these keys
