# Desktop-agnostic keybindings: action name -> key chord.
# Chord syntax: modifiers Meta, Ctrl, Alt, Shift joined with '+', then the key
# (a letter, digit, F-key, Return, Space, Tab, Escape, Print, Left/Right/Up/Down).
# Renderers map each action to their desktop's own mechanism and warn about actions
# they do not know instead of failing.
# The values are placeholders until Phase 2 curates them.
actions:
  terminal: Meta+Return
  launcher: Meta+Space
  browser: Meta+B
  files: Meta+E
  close-window: Meta+Q
  overview: Meta+Tab
  lock-screen: Meta+L
  screenshot: Print
