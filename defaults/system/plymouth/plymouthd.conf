# patina: the boot splash is patina's (defaults/boot/), which `patina install` draws into
# /usr/share/plymouth/themes/patina before it rebuilds the initramfs that carries it.
# At once and with Debian's wait for the screen, also where Debian's defaults are gone.
# Source: defaults/system/ in the patina checkout; `patina install` writes it here.
[Daemon]
Theme=patina
ShowDelay=0
DeviceTimeout=8
