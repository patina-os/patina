# patina: a one-second boot menu, after CachyOS. Hold Shift at boot for the menu.
# Source: defaults/system/ in the patina checkout; `patina install` writes it here
# and runs update-grub.
GRUB_TIMEOUT=1
# The boot splash (defaults/boot/, Plymouth) instead of the kernel's text: quiet and
# splash on the kernel's line, each once, whatever the installer put there.
for patina_word in quiet splash; do
  case " $GRUB_CMDLINE_LINUX_DEFAULT " in
    *" $patina_word "*) ;;
    *) GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:+$GRUB_CMDLINE_LINUX_DEFAULT }$patina_word" ;;
  esac
done
unset patina_word
# The menu's entry: patina and Debian's release (patina / Debian 13; GRUB adds
# GNU/Linux). grub-install and Debian's grub-efi packages read this file too, and take
# the first word of the same setting, lowercased, as the system's folder on the EFI
# partition, which must stay as it is (debian): Debian's signed GRUB reads its
# configuration from EFI/debian, and the updates of GRUB and shim go where the word
# says. So the name is only for grub-mkconfig, which writes the menu (update-grub runs
# it); the others read the setting as /etc/default/grub has it ("Debian GNU/Linux").
if [ "${0##*/}" = grub-mkconfig ]; then
  GRUB_DISTRIBUTOR="patina / Debian$( . /etc/os-release && echo "${VERSION_ID:+ $VERSION_ID}" )"
fi
# On a disk patina shares with other systems the menu lists them and stays five seconds,
# time to pick one (November 2026, after an install beside Windows 11 and CachyOS, whose
# menu was patina's alone for a second). os-prober finds them, which the image brings
# for its installer's "alongside" and Debian's installer adds where it finds a system;
# without it this does nothing. Debian turns it off by default; it runs only when
# grub-mkconfig writes the menu, not in grub-install or the packages' scripts.
GRUB_DISABLE_OS_PROBER=false
if [ "${0##*/}" = grub-mkconfig ] && command -v os-prober > /dev/null \
  && [ -n "$(os-prober 2> /dev/null)" ]; then
  GRUB_TIMEOUT=5
fi
# The boot menu's theme (defaults/boot/grub/), drawn there by `patina install`, and its
# ground behind the kernel's first lines once an entry boots. GRUB keeps Debian's look
# until they are drawn: theme.txt is written last.
if [ -f /boot/grub/themes/patina/theme.txt ]; then
  GRUB_THEME=/boot/grub/themes/patina/theme.txt
  GRUB_BACKGROUND=/boot/grub/themes/patina/ground.png
fi
