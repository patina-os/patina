# patina: memory settings for zram swap, after the configuration CachyOS ships.
# Source: defaults/system/ in the patina checkout; `patina install` writes it here and
# overwrites edits. Override in a file that sorts later, such as 99-zz-local.conf.

# Swap early and freely: the swap device is compressed RAM, not a disk.
vm.swappiness = 100
# zram has no seek cost, so read back one page at a time.
vm.page-cluster = 0
# Keep directory and inode caches a little longer than the default.
vm.vfs_cache_pressure = 50
# Dirty-page limits in bytes instead of a share of RAM, so a machine with much memory
# does not stall on one huge write-back.
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
vm.dirty_writeback_centisecs = 1500
