# patina: zram swap with zstd through systemd-zram-generator, after CachyOS.
# Source: defaults/system/ in the patina checkout; `patina install` writes it here.
# The device is sized like RAM; it holds only compressed pages, so it uses far less.
[zram0]
compression-algorithm = zstd
zram-size = ram
swap-priority = 100
