# patina: the boot splash (defaults/boot/, Plymouth) stays until the login screen takes
# the screen, with no text console in between, as GNOME's display manager does it: SDDM
# quits the splash keeping its last picture, in place of the generic plymouth-quit,
# which drops back to the console first. If SDDM fails, plymouth-quit still runs.
# Source: defaults/system/ in the patina checkout; `patina install` writes it here.
[Unit]
Conflicts=plymouth-quit.service
OnFailure=plymouth-quit.service

[Service]
ExecStartPre=-/usr/bin/plymouth quit --retain-splash
