# patina: the login screen starts once the boot splash (defaults/boot/, Plymouth) has
# quit, as SDDM's own unit orders it and Debian's suggests in a comment. Debian's SDDM
# starts its X server on a VT of its own (VT 2), and a splash quit with --retain-splash
# leaves its VT in graphics mode, where the kernel ignores every switch to another VT:
# X waited for VT 2 for ever and the screen stayed black after the splash. Debian's
# plymouth-quit.service quits it without, so tty1 is a text console again, and blank
# (quiet), for the moment until the login screen shows.
# Source: defaults/system/ in the patina checkout; `patina install` writes it here.
[Unit]
After=plymouth-quit.service
