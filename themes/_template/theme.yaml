# patina theme. Copy this directory to themes/<name>/ and edit every field.
# Colours are desktop-agnostic data; desktops/<desktop>/ renders them.
name: template                 # directory name: lowercase, kebab-case
display_name: Template
description: One sentence, shown on the installer's theme page.  # optional
author: Your Name
license: GPL-3.0-or-later      # the theme data; SPDX identifier
artwork_license: CC-BY-SA-4.0  # wallpapers and other images; SPDX identifier
variant: dark                  # dark or light; tells renderers which base styles to start from

# Optional: the palette keys the desktop's accent (selections, focus, the active
# window) and its second colour (hover, glows, the end of gradients) come from.
# Left out, they are base0E and base0F.
accent: base0E
accent_alt: base0F

# base16 palette: https://github.com/tinted-theming/home/blob/main/styling.md
# Copy the palette block of an existing scheme or define your own. The values below
# are placeholders. base10..base17 (base24) are optional extras.
palette:
  base00: "#1e1e1e"  # default background
  base01: "#262626"  # lighter background: status bars, line numbers
  base02: "#303030"  # selection background
  base03: "#5a5a5a"  # comments, invisibles
  base04: "#8a8a8a"  # dark foreground: status bars
  base05: "#d0d0d0"  # default foreground
  base06: "#e0e0e0"  # light foreground, rarely used
  base07: "#f0f0f0"  # lightest, rarely used
  base08: "#e06c75"  # red: errors, deleted
  base09: "#d19a66"  # orange: constants
  base0A: "#e5c07b"  # yellow: classes, search
  base0B: "#98c379"  # green: strings, added
  base0C: "#56b6c2"  # cyan: regular expressions, escapes
  base0D: "#61afef"  # blue: functions, links
  base0E: "#c678dd"  # magenta: keywords
  base0F: "#be5046"  # brown: deprecated

# Images relative to this directory; the first one is the default. An SVG is rendered by
# the desktop renderer when the theme is applied (at 3840x2160; nothing rendered is
# committed), a PNG is used as it is. The template ships no image: add your own under
# wallpapers/.
wallpapers:
  - wallpapers/template.svg

# Optional per-desktop hints. Still data: a renderer reads them, nothing executes here.
plasma:
  icons: breeze-dark             # icon theme as packaged by Debian
  cursors: breeze_cursors
  desktop_theme: default         # the panel and widget style; default follows the colour scheme

# Optional: the theme's other mode, named after it (light: in a dark theme, dark: in a
# light one), which `patina theme mode` switches to. The palette is complete on its
# own; wallpapers and plasma hints left out come from above. themes/aurora has one.
# light:
#   palette:
#     base00: "#f5f5f5"
#     ...                        # base01..base0F as above
#   wallpapers:
#     - wallpapers/template-light.svg
#   plasma:
#     icons: breeze
