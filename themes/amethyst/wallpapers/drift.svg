<?xml version="1.0" encoding="UTF-8"?>
<!-- amethyst "drift": ribbons of pink and purple light drifting over a deep aubergine
     field. Abstract, generated, CC-BY-SA-4.0 (themes/amethyst/theme.yaml). -->
<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120d19"/>
      <stop offset="0.55" stop-color="#15101d"/>
      <stop offset="1" stop-color="#1c1427"/>
    </linearGradient>
    <radialGradient id="glow-purple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-pink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5fd0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff5fd0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon-a" gradientUnits="userSpaceOnUse" x1="200" y1="1700" x2="3700" y2="500">
      <stop offset="0" stop-color="#6d4de0"/>
      <stop offset="0.5" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#ff5fd0"/>
    </linearGradient>
    <linearGradient id="ribbon-b" gradientUnits="userSpaceOnUse" x1="0" y1="600" x2="3840" y2="1900">
      <stop offset="0" stop-color="#ff5fd0"/>
      <stop offset="0.6" stop-color="#a06cf5"/>
      <stop offset="1" stop-color="#4c3bb8"/>
    </linearGradient>
    <linearGradient id="ribbon-c" gradientUnits="userSpaceOnUse" x1="800" y1="2160" x2="3200" y2="0">
      <stop offset="0" stop-color="#3b2f8f"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f0a8f0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="haze" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="21" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.8  0 0 0 0 0.95  0 0 0 0.07 0"/>
    </filter>
  </defs>

  <rect width="3840" height="2160" fill="url(#field)"/>

  <!-- ambient light -->
  <ellipse cx="760" cy="1750" rx="1500" ry="900" fill="url(#glow-purple)"/>
  <ellipse cx="3150" cy="420" rx="1300" ry="800" fill="url(#glow-pink)"/>

  <!-- deep, soft ribbons -->
  <g fill="none" stroke-linecap="round">
    <path d="M -700 1850 C 700 1500, 900 2000, 1700 1500 S 2900 700, 4100 500"
      stroke="url(#ribbon-a)" stroke-width="420" opacity="0.55" filter="url(#soft)"/>
    <path d="M -700 350 C 600 900, 1300 300, 2000 900 S 3300 1500, 4000 1900"
      stroke="url(#ribbon-b)" stroke-width="360" opacity="0.5" filter="url(#soft)"/>
    <path d="M 500 2600 C 1000 1400, 1800 1700, 2300 1100 S 2900 100, 3400 -200"
      stroke="url(#ribbon-c)" stroke-width="300" opacity="0.45" filter="url(#soft)"/>
  </g>

  <!-- mid ribbons: the forms the eye reads -->
  <g fill="none" stroke-linecap="round">
    <path d="M -300 1650 C 700 1450, 1000 1900, 1700 1450 S 2800 750, 4100 620"
      stroke="url(#ribbon-a)" stroke-width="150" opacity="0.8" filter="url(#haze)"/>
    <path d="M -200 560 C 600 950, 1350 400, 2050 950 S 3300 1480, 4000 1820"
      stroke="url(#ribbon-b)" stroke-width="120" opacity="0.7" filter="url(#haze)"/>
    <path d="M 500 2300 C 950 1400, 1750 1750, 2250 1150 S 2850 150, 3400 -200"
      stroke="url(#ribbon-c)" stroke-width="110" opacity="0.65" filter="url(#haze)"/>
  </g>

  <!-- sharp strands with a little light on them -->
  <g fill="none" stroke-linecap="round" filter="url(#edge)">
    <path d="M -300 1600 C 700 1420, 1050 1840, 1720 1400 S 2780 780, 4100 680"
      stroke="url(#ribbon-a)" stroke-width="22" opacity="0.9"/>
    <path d="M -300 1690 C 720 1500, 980 1950, 1690 1500 S 2850 740, 4100 560"
      stroke="#f0d6ff" stroke-width="5" opacity="0.5"/>
    <path d="M -200 620 C 620 1000, 1400 450, 2100 1000 S 3320 1520, 4000 1760"
      stroke="url(#ribbon-b)" stroke-width="16" opacity="0.85"/>
    <path d="M -200 500 C 580 900, 1300 350, 2000 880 S 3280 1440, 4000 1880"
      stroke="#ffd0f0" stroke-width="4" opacity="0.45"/>
    <path d="M 440 2300 C 900 1420, 1700 1700, 2200 1100 S 2800 180, 3400 -200"
      stroke="url(#ribbon-c)" stroke-width="14" opacity="0.8"/>
    <path d="M 560 2300 C 1000 1380, 1800 1800, 2300 1200 S 2920 120, 3440 -200"
      stroke="#e9d5ff" stroke-width="3" opacity="0.4"/>
  </g>

  <!-- film grain, so the gradients do not band -->
  <rect width="3840" height="2160" filter="url(#grain)"/>
</svg>
