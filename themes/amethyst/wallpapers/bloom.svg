<?xml version="1.0" encoding="UTF-8"?>
<!-- amethyst "bloom": translucent forms opening out of the dark, lit from pink to
     purple. Abstract, generated, CC-BY-SA-4.0 (themes/amethyst/theme.yaml). -->
<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <defs>
    <linearGradient id="field" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#110c17"/>
      <stop offset="0.6" stop-color="#15101d"/>
      <stop offset="1" stop-color="#1a1325"/>
    </linearGradient>
    <linearGradient id="lobe-pink" gradientUnits="userSpaceOnUse" x1="1400" y1="200" x2="3000" y2="1400">
      <stop offset="0" stop-color="#ff5fd0" stop-opacity="0.75"/>
      <stop offset="0.6" stop-color="#c084fc" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6d4de0" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="lobe-purple" gradientUnits="userSpaceOnUse" x1="500" y1="2000" x2="2100" y2="1000">
      <stop offset="0" stop-color="#4c3bb8" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#8b5cf6" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#e49cf7" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="lobe-violet" gradientUnits="userSpaceOnUse" x1="3600" y1="2000" x2="2000" y2="900">
      <stop offset="0" stop-color="#3b2f8f" stop-opacity="0.1"/>
      <stop offset="0.6" stop-color="#9d6ef9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb0ea" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff2fb" stop-opacity="0.85"/>
      <stop offset="0.35" stop-color="#ffa3e6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ff5fd0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambient" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6d4de0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6d4de0" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
    <filter id="haze" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="edge" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="21" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.8  0 0 0 0 0.95  0 0 0 0.07 0"/>
    </filter>
  </defs>

  <rect width="3840" height="2160" fill="url(#field)"/>
  <ellipse cx="2100" cy="1150" rx="1900" ry="1100" fill="url(#ambient)"/>

  <!-- the deep layer: the same forms, wide and dim, as their own shadowless glow -->
  <g filter="url(#soft)" opacity="0.7">
    <path d="M 1500 1250 C 1300 700, 1900 150, 2700 350 C 3400 550, 3300 1300, 2700 1450 C 2200 1580, 1650 1600, 1500 1250 Z" fill="url(#lobe-pink)"/>
    <path d="M 2100 1200 C 1700 1900, 900 2100, 500 1700 C 200 1350, 700 950, 1300 950 C 1800 950, 2250 950, 2100 1200 Z" fill="url(#lobe-purple)"/>
    <path d="M 2250 1300 C 2900 1250, 3700 1500, 3600 2000 C 3500 2400, 2700 2400, 2400 2000 C 2200 1750, 2000 1450, 2250 1300 Z" fill="url(#lobe-violet)"/>
  </g>

  <!-- the forms themselves: translucent, overlapping, each lit from one side -->
  <g filter="url(#haze)">
    <path d="M 1500 1250 C 1300 700, 1900 150, 2700 350 C 3400 550, 3300 1300, 2700 1450 C 2200 1580, 1650 1600, 1500 1250 Z" fill="url(#lobe-pink)" opacity="0.9"/>
    <path d="M 2100 1200 C 1700 1900, 900 2100, 500 1700 C 200 1350, 700 950, 1300 950 C 1800 950, 2250 950, 2100 1200 Z" fill="url(#lobe-purple)" opacity="0.85"/>
    <path d="M 2250 1300 C 2900 1250, 3700 1500, 3600 2000 C 3500 2400, 2700 2400, 2400 2000 C 2200 1750, 2000 1450, 2250 1300 Z" fill="url(#lobe-violet)" opacity="0.85"/>
    <path d="M 2000 1100 C 2300 900, 2500 700, 2800 800 C 3000 870, 2800 1150, 2500 1200 C 2250 1240, 1900 1250, 2000 1100 Z" fill="#ff8ddd" opacity="0.25"/>
  </g>

  <!-- the light where the forms meet -->
  <ellipse cx="2080" cy="1220" rx="560" ry="380" fill="url(#core)" filter="url(#haze)" transform="rotate(-25 2080 1220)"/>

  <!-- filaments: the few lines the eye follows -->
  <g fill="none" stroke-linecap="round" filter="url(#edge)">
    <path d="M 1450 1300 C 1250 700, 1950 100, 2750 320" stroke="#ffd4f4" stroke-width="4" opacity="0.45"/>
    <path d="M 2050 1250 C 1650 1950, 850 2150, 450 1750" stroke="#e9d5ff" stroke-width="4" opacity="0.4"/>
    <path d="M 2300 1340 C 2950 1290, 3750 1540, 3650 2040" stroke="#f2e4ff" stroke-width="3" opacity="0.35"/>
    <path d="M 1900 1500 C 2100 1250, 2500 1200, 2900 1050" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  </g>

  <rect width="3840" height="2160" filter="url(#grain)"/>
</svg>
