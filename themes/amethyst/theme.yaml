# amethyst: the first patina21 theme. A purple signature palette that continues the
# logo's pink-to-purple gradient on a deep aubergine background. Desktop-agnostic data;
# desktops/<desktop>/ renders it.
name: amethyst
display_name: Amethyst
author: patina21 contributors
license: GPL-3.0-or-later      # the theme data
artwork_license: CC-BY-SA-4.0  # the wallpapers under wallpapers/
variant: dark

# base16 palette: https://github.com/tinted-theming/home/blob/main/styling.md
palette:
  base00: "#15101d"  # default background: deep aubergine
  base01: "#1e1727"  # lighter background: status bars, line numbers, panels
  base02: "#2b2138"  # selection background in editors, buttons
  base03: "#5e5075"  # comments, invisibles
  base04: "#8f80a9"  # dark foreground: status bars
  base05: "#d9d0e8"  # default foreground: lavender white
  base06: "#ebe4f5"  # light foreground
  base07: "#f7f3fc"  # lightest
  base08: "#ff6b8b"  # red: errors, deleted
  base09: "#ff9f6b"  # orange: constants
  base0A: "#f5c66b"  # yellow: classes, search
  base0B: "#7fd8a4"  # green: strings, added
  base0C: "#6fd5e0"  # cyan: regular expressions, escapes
  base0D: "#8fa3ff"  # blue: functions, links
  base0E: "#c084fc"  # magenta: keywords; the accent colour of the desktop
  base0F: "#ff5fd0"  # the logo's pink: deprecated, embedded tags

# Images relative to this directory; the first one is the default. SVG files are
# rendered by the desktop renderer at apply time; nothing rendered is committed.
wallpapers:
  - wallpapers/drift.svg
  - wallpapers/bloom.svg

# Per-desktop hints, still data.
plasma:
  icons: breeze-dark             # icon theme as packaged by Debian
  cursors: breeze_cursors
  look_and_feel: org.kde.breezedark.desktop   # the base the generated look-and-feel starts from
