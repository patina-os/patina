# The AI agent on this machine with Hermes Agent instead of opencode: a model Ollama
# runs locally, so nothing leaves the computer. Hermes (MIT) comes from its own
# installer, pinned to a release (manifest/upstream.yaml); it remembers across
# conversations and asks first only before a command it counts as dangerous, not before
# every change. One of the answers to the AI question of `patina install` (the `ai` and
# `agent` keys), not a line of the bundle list. kortex puts it into KRunner.
name: hermes-local
description: Hermes Agent on this machine · a local model from Ollama
default: false
ai: local
agent: hermes
packages:
  - kdialog   # the password dialog for the agent's `sudo -A` (desktops/plasma/askpass.sh)
  - python3-dbus   # kortex, the agent in the command palette
  - python3-gi
  - ripgrep   # Hermes searches files with it
flatpaks: []
upstream:
  - hermes
  - kortex
  - uv   # uvx runs local MCP servers, the Nextcloud preset's (defaults/services.yaml)
  - ollama
