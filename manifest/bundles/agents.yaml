# The agent tools. Opt-in: most of them are proprietary, and the README's stance rules
# out proprietary defaults. Everything here comes from its upstream installer; Ollama is
# the only one with a free licence and the only one that runs local models.
name: agents
description: Claude Code · Codex · opencode · Claude Desktop · Ollama
default: false
packages:
  - nodejs   # the npm installs below
  - npm
  - kdialog   # the password dialog for the agent's `sudo -A` (desktops/plasma/askpass.sh)
  - libnotify-bin   # notify-send: the password dialog waits for a click on its notification
flatpaks: []
upstream:
  - claude-code
  - codex
  - opencode
  - claude-desktop
  - ollama
system:   # files of defaults/system/ written only with a bundle that names them
  - sudoers.d/patina   # one sudo password for the agent's commands, not one per command
