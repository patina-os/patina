# The polished-desktop bundle: the app stack from the README, all free software. The
# package names are Debian 13's; the smoke test installs the bundle on amd64 and arm64.
name: desktop
description: Curated desktop apps with kitty and the developer tools
default: true
packages:
  - fonts-adobe-sourcesans3 # fonts.ui of defaults/settings.yaml
  - fonts-jetbrains-mono # fonts.monospace, the text mark and the wallpaper labels
  - fonts-sora           # the wordmark (branding/wordmark.svg) on the splash
  - papirus-icon-theme   # aurora's icons; the renderer recolours its folders to the accent
  - nextcloud-desktop
  - thunderbird
  - keepassxc
  - firefox-esr  # the browser; its policies: defaults/system/firefox/
  - okular       # PDF and documents
  - gwenview     # images
  - haruna       # video
  - kitty        # the terminal; Ghostty takes its place when Debian carries it (Phase 6)
  - fish
  - starship
  - bat
  - eza
  - fzf
  - ripgrep
  - lazygit
  - btop
  - zoxide
  - atuin
  - git-delta
  - neovim
  - fastfetch
flatpaks:
  - im.riot.Riot         # Element
  - dev.zed.Zed          # Zed editor; telemetry and AI off through defaults/apps.yaml
  - com.github.taiko2k.tauonmb   # Tauon, the music player; Debian does not package it
upstream:
  - euro-office          # from Nextcloud's signed apt repository until Flathub carries it
