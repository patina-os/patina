# The AI agent on this machine: opencode with a model Ollama runs locally, so nothing
# leaves the computer. One of the answers to the AI question of `patina install` (the
# `ai` key), not a line of the bundle list. opencode and Ollama are free (MIT) and come
# from their upstream installers because Debian packages neither; kortex puts the agent
# into KRunner and comes from its tagged release.
name: ai-local
description: The AI agent on this machine · opencode with a local model from Ollama
default: false
ai: local
packages:
  - nodejs   # the npm install of opencode
  - npm
  - kdialog   # the password dialog for the agent's `sudo -A` (desktops/plasma/askpass.sh)
  - python3-dbus   # kortex, the agent in the command palette
  - python3-gi
flatpaks: []
upstream:
  - opencode
  - kortex
  - ollama
