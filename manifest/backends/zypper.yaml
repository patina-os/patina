# Backend for openSUSE (zypper). The reference backend: canonical names are openSUSE's,
# so the map below should stay empty or nearly so.
name: zypper
os_ids:   # ID= values from /etc/os-release this backend serves
  - opensuse-tumbleweed
  - opensuse-slowroll
  - opensuse-leap
refresh: sudo zypper --non-interactive refresh
install: sudo zypper --non-interactive install   # package names are appended
installed: rpm -q                                # exit 0 when the package is installed
map: {}   # canonical name -> zypper name, only where they differ
