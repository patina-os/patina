# Backend for openSUSE (zypper). Kept as data for a possible later base; it is not run in
# CI and nothing is tested on it until the roadmap says so. Canonical names are Debian's.
name: zypper
os_ids:   # ID= values from /etc/os-release this backend serves
  - opensuse-tumbleweed
  - opensuse-slowroll
  - opensuse-leap
refresh: sudo zypper --non-interactive refresh
install: sudo zypper --non-interactive install   # package names are appended
installed: rpm -q                                # exit 0 when the package is installed
map:      # canonical (Debian) name -> zypper name, only where they differ
  thunderbird: MozillaThunderbird
  librsvg2-bin: rsvg-convert
  fonts-inter: inter-fonts
  fonts-jetbrains-mono: jetbrains-mono-fonts
system:   # untested, like the rest of this file; the files under defaults/system/ that name
          # initramfs-tools and /etc/default/grub.d are Debian's and need a map here later
  write: sudo install -D -m 0644
  apply:
    - sudo systemctl daemon-reload
    - sudo sysctl --system
    - sudo udevadm control --reload
    - sudo systemd-tmpfiles --create
    - sudo systemctl enable --now systemd-oomd.service
    - sudo dracut --regenerate-all --force
    - sudo grub2-mkconfig -o /boot/grub2/grub.cfg
