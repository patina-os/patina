# Tools installed from their upstream installers, used only when no packaged version is
# worth using. Every entry names its `method` and, for the is-installed check, the
# `command` it puts on PATH (binary, script) or the `package` it installs (npm, uv,
# apt-source); a git recipe is checked by the `ref` recorded when it was installed.
# Methods:
#   npm         global package via the base's nodejs and npm, into ~/.local
#   uv          Python tool via `uv tool install` (uv itself is the `uv` recipe)
#   script      the upstream's documented install script (the only `curl | sh` allowed)
#   binary      a single static binary from the upstream's release page, installed to
#               ~/.local/bin; `arch` maps uname -m to the upstream's file name
#   apt-source  the upstream's own signed apt repository, written as <name>.sources in
#               deb822 form with the key at `keyring`, through the backend's sudo path,
#               then installed with apt; for opt-in tools, and for a default only when
#               the software is free and neither Debian's archive nor Flathub carries it
#               (Euro-Office). Only an apt base can run it.
#   git         a tagged release of a repository: cloned at `ref` into the user's cache,
#               installed per user by the repository's own `install` script, the clone
#               removed again. The ref is recorded in the state directory, so a new
#               `ref` here installs again on the next `patina install`
# Checked against the upstreams in Phase 1 (docs/roadmap.md).
yq:
  # Debian's `yq` package is the Python jq wrapper, not the Go yq the data format is
  # written for, so the Go release binary is the only option on Debian. bin/patina-install
  # fetches it before it can read this file; its copy of this URL must stay identical.
  method: binary
  url: https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${arch}
  arch:
    x86_64: amd64
    aarch64: arm64
  command: yq
uv:
  # Debian 13 does not package uv; a Python-based agent tool would need it.
  method: script
  url: https://astral.sh/uv/install.sh
  command: uv
euro-office:
  # Euro-Office, the AGPL fork of ONLYOFFICE by a European consortium. Debian does not
  # package it and Flathub does not carry it yet, so the signed builds come from
  # Nextcloud's apt repository, where they are published as Nextcloud Office (amd64 and
  # arm64). The one default from an upstream repository; it moves to Flathub as soon as
  # Flathub carries it.
  method: apt-source
  name: nextcloud-office
  key: https://download.nextcloud.com/office/repo/nextcloud-office.asc
  keyring: /etc/apt/keyrings/nextcloud-office.asc
  source:   # one deb822 stanza: URIs, Suites, Components, signed by the keyring above
    url: https://download.nextcloud.com/office/repo/deb
    suite: stable
    components: main
  package: nextcloud-office-nextcloudoffice
claude-code:
  method: npm
  package: "@anthropic-ai/claude-code"
  command: claude
codex:
  method: npm
  package: "@openai/codex"
  command: codex
opencode:
  method: npm
  package: opencode-ai
  command: opencode
claude-desktop:
  # Anthropic ships Claude Desktop for Linux only as a Debian package, from its own
  # signed apt repository (amd64 and arm64). apt then keeps it updated like any other
  # package.
  method: apt-source
  name: claude-desktop
  key: https://downloads.claude.ai/claude-desktop/key.asc
  keyring: /etc/apt/keyrings/claude-desktop.asc
  source:
    url: https://downloads.claude.ai/claude-desktop/apt/stable
    suite: stable
    components: main
  package: claude-desktop
  command: claude-desktop
kortex:
  # The AI agent in the command palette: `ai` and a request in KRunner. patina's own
  # project, kept in a repository of its own because it is Python, which patina's
  # tooling does not use; its install script puts it under ~/.local/share, no root.
  # Needs python3-dbus and python3-gi, which the AI bundles list.
  method: git
  url: https://github.com/patina21/kortex.git
  ref: v0.1.0
  install: install.sh
ollama:
  # Its installer sets up the ollama service; it asks for sudo itself. Ollama is the
  # local backend the agent tools point at (defaults/apps.yaml).
  method: script
  url: https://ollama.com/install.sh
  command: ollama
