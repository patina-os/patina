<!-- The patina wordmark for screens: the mark of logo.txt typeset in JetBrains Mono
     beside patina in Sora ExtraBold. The colours are the brand's, not a theme's: the
     rings shade from slate (i) through ice (t) to pale ice (n, a), the word stands out
     in white and the survey point in coral, the lockup's one accent. Every character here is the
     character of logo.txt in the same place; change both together (branding/README.md).
     wordmark.txt is the terminal form of the word. GPL-3.0-or-later. -->
