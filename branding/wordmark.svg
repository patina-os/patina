<!-- The patina21 wordmark for screens: the text mark of logo.txt typeset in JetBrains
     Mono beside patina²¹ in Sora ExtraBold, the 21 set small and raised, in coral. The
     colours are the brand's, not a theme's: the rings shade from slate (i) through ice (t)
     to pale ice (n), the word and the survey point stand out. Every character here is the
     character of logo.txt in the same place; change both together (branding/README.md).
     GPL-3.0-or-later. -->
