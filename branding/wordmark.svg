<?xml version="1.0" encoding="UTF-8"?>
<!-- The patina21 wordmark for screens: patina²¹ in Inter, the 21 as the font's own
     superscript figures in the pink-to-purple gradient, the patina wave under it. The
     colours are the brand's, not a theme's. The text mark for terminals is logo.txt;
     branding/README.md says where each one goes. GPL-3.0-or-later. -->
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="160" viewBox="0 0 560 160">
  <defs>
    <linearGradient id="patina" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5fd0"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <text x="16" y="104" font-family="Inter, sans-serif" font-weight="600" font-size="104"
    letter-spacing="-3.5" fill="#f7f3fc">patina<tspan fill="url(#patina)">²¹</tspan></text>
  <path d="M 20 134 q 15 -9 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0"
    fill="none" stroke="url(#patina)" stroke-width="3.5" stroke-linecap="round"/>
</svg>
