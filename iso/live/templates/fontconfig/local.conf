<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The live system's standard fonts, rendered by iso/live/assets.sh from the fonts of
     defaults/settings.yaml into /etc/fonts/local.conf. Calamares draws its sidebar and
     a few widgets in Qt's application font, which the stylesheet does not reach; Qt asks
     fontconfig for "Sans Serif", so these aliases make that the layer's font too. -->
<fontconfig>
  <alias binding="same">
    <family>Sans Serif</family>
    <prefer><family>${UI_FONT}</family></prefer>
  </alias>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>${UI_FONT}</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>${MONO_FONT}</family></prefer>
  </alias>
</fontconfig>
