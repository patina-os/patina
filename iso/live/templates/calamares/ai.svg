<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <!-- the picture of one answer on the AI page (modules/packagechooser-ai.conf):
       its name, a detail line, and the agent asking before a change -->
  <rect width="960" height="540" rx="24" fill="${BASE01}"/>
  <rect x="1" y="1" width="958" height="538" rx="23" fill="none" stroke="${ACCENT}"
    stroke-opacity="0.5" stroke-width="2"/>
  <text x="64" y="104" font-family="${MONO_FONT}, monospace" font-size="26"
    fill="${ACCENT}">▲ <tspan fill="${BASE04}">agent</tspan></text>
  <text x="64" y="214" font-family="'${UI_FONT}', sans-serif" font-size="60"
    font-weight="600" fill="${BASE05}">${AI_NAME}</text>
  <text x="64" y="276" font-family="${MONO_FONT}, monospace" font-size="24"
    fill="${BASE04}">${AI_DETAIL}</text>
  <g opacity="${AI_DEMO}">
    <rect x="64" y="330" width="832" height="146" rx="14" fill="${BASE00}"/>
    <text x="96" y="388" font-family="${MONO_FONT}, monospace" font-size="24"
      fill="${BASE05}"><tspan fill="${ACCENT_ALT}">›</tspan> switch to the light theme</text>
    <text x="96" y="440" font-family="${MONO_FONT}, monospace" font-size="24"
      fill="${BASE04}">patina theme mode light  <tspan fill="${ACCENT}">allow? y/n</tspan></text>
  </g>
</svg>
