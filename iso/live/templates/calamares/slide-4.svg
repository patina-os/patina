<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- slide 4, the apps: one free app for every everyday job, laid out as the landing
       page lists them (a rule above each), and what else is one checkbox away -->
  <image xlink:href="ground.png" width="1920" height="1080"/>
  <rect x="140" y="164" width="172" height="52" rx="10" fill="${ACCENT}" fill-opacity="0.12"/>
  <text x="158" y="200" font-family="${MONO_FONT}, monospace" font-size="26" font-weight="600"
    fill="${ACCENT}">The apps</text>
  <text font-family="'${DISPLAY_FONT}', sans-serif" font-size="76" font-weight="700"
    letter-spacing="-2" fill="${BASE05}"><tspan x="140" y="310">One good, free app for every job.</tspan></text>
  <rect x="140" y="400" width="520" height="3" fill="${BASE05}"/>
  <text x="140" y="456" font-family="${MONO_FONT}, monospace" font-size="24" fill="${ACCENT}">Mail and calendar</text>
  <text x="140" y="522" font-family="'${DISPLAY_FONT}', sans-serif" font-size="50" font-weight="700"
    letter-spacing="-1" fill="${BASE05}">Thunderbird</text>
  <text x="140" y="576" font-family="'${UI_FONT}', sans-serif" font-size="32" fill="${BASE04}">All your accounts, one inbox.</text>
  <rect x="700" y="400" width="520" height="3" fill="${BASE05}"/>
  <text x="700" y="456" font-family="${MONO_FONT}, monospace" font-size="24" fill="${ACCENT}">Files everywhere</text>
  <text x="700" y="522" font-family="'${DISPLAY_FONT}', sans-serif" font-size="50" font-weight="700"
    letter-spacing="-1" fill="${BASE05}">Nextcloud</text>
  <text x="700" y="576" font-family="'${UI_FONT}', sans-serif" font-size="32" fill="${BASE04}">Synced in the EU or at home.</text>
  <rect x="1260" y="400" width="520" height="3" fill="${BASE05}"/>
  <text x="1260" y="456" font-family="${MONO_FONT}, monospace" font-size="24" fill="${ACCENT}">Documents</text>
  <text x="1260" y="522" font-family="'${DISPLAY_FONT}', sans-serif" font-size="50" font-weight="700"
    letter-spacing="-1" fill="${BASE05}">Euro-Office</text>
  <text x="1260" y="576" font-family="'${UI_FONT}', sans-serif" font-size="32" fill="${BASE04}">Opens Word, Excel, PowerPoint.</text>
  <rect x="140" y="650" width="520" height="3" fill="${BASE05}"/>
  <text x="140" y="706" font-family="${MONO_FONT}, monospace" font-size="24" fill="${ACCENT}">Passwords</text>
  <text x="140" y="772" font-family="'${DISPLAY_FONT}', sans-serif" font-size="50" font-weight="700"
    letter-spacing="-1" fill="${BASE05}">KeePassXC</text>
  <text x="140" y="826" font-family="'${UI_FONT}', sans-serif" font-size="32" fill="${BASE04}">In a file only you hold.</text>
  <rect x="700" y="650" width="520" height="3" fill="${BASE05}"/>
  <text x="700" y="706" font-family="${MONO_FONT}, monospace" font-size="24" fill="${ACCENT}">The web</text>
  <text x="700" y="772" font-family="'${DISPLAY_FONT}', sans-serif" font-size="50" font-weight="700"
    letter-spacing="-1" fill="${BASE05}">Firefox ESR</text>
  <text x="700" y="826" font-family="'${UI_FONT}', sans-serif" font-size="32" fill="${BASE04}">No telemetry, no sponsored ads.</text>
  <rect x="1260" y="650" width="520" height="3" fill="${BASE05}"/>
  <text x="1260" y="706" font-family="${MONO_FONT}, monospace" font-size="24" fill="${ACCENT}">Chat</text>
  <text x="1260" y="772" font-family="'${DISPLAY_FONT}', sans-serif" font-size="50" font-weight="700"
    letter-spacing="-1" fill="${BASE05}">Element</text>
  <text x="1260" y="826" font-family="'${UI_FONT}', sans-serif" font-size="32" fill="${BASE04}">Encrypted chat on Matrix.</text>
  <text x="140" y="960" font-family="'${UI_FONT}', sans-serif" font-size="32" fill="${BASE04}">Okular, Gwenview and Haruna for PDFs, photos and video. Zed, Tauon and ArtCraft are one checkbox away.</text>
</svg>
