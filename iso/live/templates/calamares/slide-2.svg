<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- slide 2, the desktop: the desktop workflow's screenshot (docs/screenshots/) in a
       window frame, and what makes the desktop familiar -->
  <defs>
    <clipPath id="screen"><rect x="860" y="250" width="940" height="529" rx="16"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>
  <image xlink:href="ground.png" width="1920" height="1080"/>
  <rect x="900" y="320" width="860" height="489" rx="16" fill="#000000" opacity="0.7" filter="url(#shadow)"/>
  <image xlink:href="desktop.png" x="860" y="250" width="940" height="529" clip-path="url(#screen)"/>
  <rect x="860" y="250" width="940" height="529" rx="16" fill="none" stroke="${BASE02}" stroke-width="2"/>
  <rect x="140" y="344" width="240" height="52" rx="10" fill="${ACCENT}" fill-opacity="0.12"/>
  <text x="158" y="380" font-family="${MONO_FONT}, monospace" font-size="26" font-weight="600"
    fill="${ACCENT}">Your desktop</text>
  <text font-family="'${DISPLAY_FONT}', sans-serif" font-size="76" font-weight="700"
    letter-spacing="-2" fill="${BASE05}"><tspan x="140" y="490">At home from</tspan><tspan x="140" y="580">the first click.</tspan></text>
  <text font-family="'${UI_FONT}', sans-serif" font-size="36" fill="${BASE04}">
    <tspan x="140" y="680">A centred bar, as on Windows 11.</tspan>
    <tspan x="140" y="732">Windows open in the middle.</tspan>
    <tspan x="140" y="784">True black, made for OLED screens.</tspan>
  </text>
</svg>
