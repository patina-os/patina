<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- slide 7, the last: what happens after the restart, in order. Calamares' own last
       page says nothing of the stick or the first start, and a PC that boots the stick
       again shows the installer's menu, which reads as a failed install. -->
  <image xlink:href="ground.png" width="1920" height="1080"/>
  <rect x="140" y="214" width="287" height="52" rx="10" fill="${ACCENT}" fill-opacity="0.12"/>
  <text x="158" y="250" font-family="${MONO_FONT}, monospace" font-size="26" font-weight="600"
    fill="${ACCENT}">After the restart</text>
  <text font-family="'${DISPLAY_FONT}', sans-serif" font-size="76" font-weight="700"
    letter-spacing="-2" fill="${BASE05}"><tspan x="140" y="360">One more start,</tspan><tspan x="140" y="450">then it is yours.</tspan></text>
  <rect x="140" y="560" width="520" height="3" fill="${BASE05}"/>
  <text x="140" y="620" font-family="${MONO_FONT}, monospace" font-size="28" fill="${ACCENT}">01</text>
  <text x="140" y="692" font-family="'${DISPLAY_FONT}', sans-serif" font-size="50" font-weight="700"
    letter-spacing="-1" fill="${BASE05}">Take out the stick</text>
  <text font-family="'${UI_FONT}', sans-serif" font-size="32" fill="${BASE04}">
    <tspan x="140" y="756">When the screen goes dark,</tspan>
    <tspan x="140" y="802">take it out, so the PC starts</tspan>
    <tspan x="140" y="848">patina, not the installer.</tspan>
  </text>
  <rect x="700" y="560" width="520" height="3" fill="${BASE05}"/>
  <text x="700" y="620" font-family="${MONO_FONT}, monospace" font-size="28" fill="${ACCENT}">02</text>
  <text x="700" y="692" font-family="'${DISPLAY_FONT}', sans-serif" font-size="50" font-weight="700"
    letter-spacing="-1" fill="${BASE05}">patina sets up</text>
  <text font-family="'${UI_FONT}', sans-serif" font-size="32" fill="${BASE04}">
    <tspan x="700" y="756">The first start fetches your</tspan>
    <tspan x="700" y="802">apps. It needs the internet</tspan>
    <tspan x="700" y="848">and takes a while.</tspan>
  </text>
  <rect x="1260" y="560" width="520" height="3" fill="${BASE05}"/>
  <text x="1260" y="620" font-family="${MONO_FONT}, monospace" font-size="28" fill="${ACCENT}">03</text>
  <text x="1260" y="692" font-family="'${DISPLAY_FONT}', sans-serif" font-size="50" font-weight="700"
    letter-spacing="-1" fill="${BASE05}">Your password</text>
  <text font-family="'${UI_FONT}', sans-serif" font-size="32" fill="${BASE04}">
    <tspan x="1260" y="756">When it asks, type the one</tspan>
    <tspan x="1260" y="802">you chose here. The login</tspan>
    <tspan x="1260" y="848">screen comes after it.</tspan>
  </text>
</svg>
