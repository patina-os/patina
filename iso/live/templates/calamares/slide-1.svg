<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- slide 1, welcome: patina in block letters, what it is, and the version -->
  <image xlink:href="ground.png" width="1920" height="1080"/>
  <image xlink:href="blocks.png" x="680" y="150" width="560" height="386"/>
  <text x="960" y="670" text-anchor="middle" font-family="'${DISPLAY_FONT}', sans-serif" font-size="64"
    font-weight="700" letter-spacing="-1.5" fill="${BASE05}">The stylish, free alternative to Windows</text>
  <text x="960" y="750" text-anchor="middle" font-family="'${UI_FONT}', sans-serif" font-size="36"
