# live-build's theme.cfg (share/bootloaders/grub-pc/), sourced by its menu and each
# submenu, with patina's theme: GRUB finds a theme's font only once it is loaded, and
# live-build loads only its own. iso/live/assets.sh draws live-theme/ next to this file
# (render_boot_menu, bin/lib.sh); without it the menu keeps live-build's colours.
# live-build's config.cfg sets gfxmode=800x600 and sources this file before it turns
# the graphics on, so this sets the mode: Full HD, which the theme is drawn for and
# most screens' firmware offers, else the screen's own (auto). It stays for the
# kernel (gfxpayload=keep), so the boot splash is as sharp from its first picture on.
set gfxmode=1920x1080,auto
set color_normal=light-gray/black
set color_highlight=white/dark-gray

if [ -e /boot/grub/live-theme/theme.txt ]; then
    loadfont /boot/grub/live-theme/font.pf2
    set theme=/boot/grub/live-theme/theme.txt
else
    set menu_color_normal=cyan/blue
    set menu_color_highlight=white/blue
fi
