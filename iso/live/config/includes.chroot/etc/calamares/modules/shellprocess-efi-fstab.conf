# Runs on the live system right after the fstab step: the fstab entry for /boot/efi
# names the EFI system partition mounted there, which efi-space.sh may have swapped for
# one with room (efi-fstab.sh). ${ROOT} is the target's root.
---
dontChroot: true
timeout: 10
script:
  - /etc/calamares/efi-fstab.sh "${ROOT}"
