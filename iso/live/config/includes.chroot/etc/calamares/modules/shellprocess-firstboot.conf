# Runs in the installed system after the packages are in: enable the first-boot unit that
# runs Path A, and drop the installer screen the live system used.
---
dontChroot: false
timeout: 60
script:
  - mkdir -p /var/lib/patina
  - systemctl enable patina-firstboot.service
  - systemctl disable patina-ui.service
  - rm -f /etc/systemd/system/patina-ui.service /root/.xinitrc
