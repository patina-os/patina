# Runs in the installed system after the packages are in: enable the first-boot unit that
# runs Path A, hand it the answers of the agent, AI, apps, more-apps and theme pages
# (Calamares fills ${gs[...]} from Global Storage: the agent page's opencode, hermes or
# none, the AI page's local or cloud, the bundles of the two app pages, the more-apps one
# a comma-separated list, maybe empty, and the theme's name), and drop the installer
# screen the live system used, with the fonts it set for Calamares (Plasma sets the
# desktop's own).
---
dontChroot: false
timeout: 60
script:
  - mkdir -p /var/lib/patina /etc/patina
  - echo "PATINA_AI_AGENT=${gs[packagechooser_agent]}" > /etc/patina/firstboot.env
  - echo "PATINA_AI=${gs[packagechooser_ai]}" >> /etc/patina/firstboot.env
  - >-
    echo "PATINA_BUNDLES=${gs[packagechooser_apps]},${gs[packagechooser_more]}"
    >> /etc/patina/firstboot.env
  - echo "PATINA_THEME=${gs[packagechooser_theme]}" >> /etc/patina/firstboot.env
  - systemctl enable patina-firstboot.service
  - systemctl disable patina-ui.service
  - rm -f /etc/systemd/system/patina-ui.service /root/.xinitrc /root/.Xdefaults
  - rm -f /etc/fonts/local.conf
