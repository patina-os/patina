# Runs in the installed system after the packages are in: enable the first-boot unit that
# runs Path A, hand it the answer of the AI page (Calamares fills ${gs[...]} from Global
# Storage; the ids are local, cloud and none), and drop the installer screen the live
# system used, with the fonts it set for Calamares (Plasma sets the desktop's own).
---
dontChroot: false
timeout: 60
script:
  - mkdir -p /var/lib/patina /etc/patina
  - echo "PATINA_AI=${gs[packagechooser_ai]}" > /etc/patina/firstboot.env
  - systemctl enable patina-firstboot.service
  - systemctl disable patina-ui.service
  - rm -f /etc/systemd/system/patina-ui.service /root/.xinitrc /root/.Xdefaults
  - rm -f /etc/fonts/local.conf
