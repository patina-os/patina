# Disk page. Erase-and-install is preselected; manual partitioning and encryption stay
# available. ext4 is Debian's default; btrfs is offered without snapshot tooling.
# Encryption is LUKS1: Calamares puts /boot inside the encrypted volume, and Debian's
# GRUB cannot unlock LUKS2 with the argon2id key derivation cryptsetup uses by default.
---
efi:
  mountPoint: /boot/efi
  recommendedSize: 512MiB
  minimumSize: 512MiB
userSwapChoices:
  - none
  - small
initialPartitioningChoice: erase
initialSwapChoice: small
defaultFileSystemType: ext4
availableFileSystemTypes:
  - ext4
  - btrfs
alwaysShowPartitionLabels: true
luksGeneration: luks1
