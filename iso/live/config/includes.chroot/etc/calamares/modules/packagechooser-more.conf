# The more-apps page: the opt-in bundles, any number of them or none. The answer goes
# to Global Storage (packagechooser_more) as a comma-separated list, and
# shellprocess-firstboot.conf adds it to PATINA_BUNDLES after the apps page's. The ids
# are bundles of manifest/bundles/ (lint checks that); assets.sh draws the pictures.
# The item with the empty id is what the page shows while nothing is picked, instead of
# Calamares' own "the selected product will be installed"; picking it adds nothing.
---
mode: optionalmultiple
method: legacy
labels:
  step: "More apps"
  step[de]: "Mehr Apps"
items:
  - id: ""
    name: "Nothing more"
    name[de]: "Nichts weiter"
    description: >-
      Standard or Minimal is enough to begin. Pick any of these to add them now;
      "patina install" adds them later at any time.
    description[de]: >-
      Standard oder Minimal genügt für den Anfang. Wähle eine davon, um sie gleich
      dazuzunehmen; „patina install“ fügt sie später jederzeit hinzu.
    screenshot: bundle-none.png
  - id: headstart
    name: "Head start"
    name[de]: "Startpaket"
    description: >-
      The Zed editor, kew and ncspot for music and Spotify in the terminal, Telegram,
      Vesktop for Discord, Signal, LocalSend and OBS Studio. All free apps; the services
      behind the chat apps are not European, so Element stays the default.
    description[de]: >-
      Der Editor Zed, kew und ncspot für Musik und Spotify im Terminal, Telegram,
      Vesktop für Discord, Signal, LocalSend und OBS Studio. Alles freie Apps; die
      Dienste hinter den Chat-Apps sind nicht europäisch, deshalb bleibt Element der
      Standard.
    screenshot: bundle-headstart.png
  - id: artcraft
    name: "ArtCraft (alpha)"
    name[de]: "ArtCraft (Alpha)"
    description: >-
      The ArtCraft Launcher: free, early counterparts of Adobe's and Microsoft's apps,
      PhotoCraft and WordCraft among them. It installs and updates the ones you pick.
    description[de]: >-
      Der ArtCraft Launcher: freie, frühe Gegenstücke zu Apps von Adobe und Microsoft,
      darunter PhotoCraft und WordCraft. Er installiert und aktualisiert die, die du
      auswählst.
    screenshot: bundle-artcraft.png
  - id: agents
    name: "Agent tools"
    name[de]: "Agent-Werkzeuge"
    description: >-
      Claude Code, Codex, opencode, Claude Desktop and Ollama, for developers. Most of
      them are proprietary, so they are opt-in.
    description[de]: >-
      Claude Code, Codex, opencode, Claude Desktop und Ollama, für Entwickler. Die
      meisten sind proprietär und deshalb optional.
    screenshot: bundle-agents.png
