# The first page. The internet check is a hard requirement: Plasma and the base bundle
# are downloaded during the install (modules/packages.conf).
---
showSupportUrl: true
showKnownIssuesUrl: true
showReleaseNotesUrl: true
showDonateUrl: false
# The language list's icon: a globe in the accent, rendered into the branding directory
# by iso/live/assets.sh. The list starts at the live system's language, British English
# (auto/config).
languageIcon: language.png

requirements:
  requiredStorage: 20
  requiredRam: 3.0
  internetCheckUrl: https://deb.debian.org
  check:
    - storage
    - ram
    - power
    - internet
    - root
  required:
    - storage
    - ram
    - internet
    - root
