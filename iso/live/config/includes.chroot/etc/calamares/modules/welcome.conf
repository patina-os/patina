# The first page. The internet check is a hard requirement: Plasma and the base bundle
# are downloaded during the install (modules/packages.conf).
---
showSupportUrl: true
showKnownIssuesUrl: true
showReleaseNotesUrl: true
showDonateUrl: false

requirements:
  requiredStorage: 20
  requiredRam: 3.0
  internetCheckUrl: https://deb.debian.org
  check:
    - storage
    - ram
    - power
    - internet
    - root
  required:
    - storage
    - ram
    - internet
    - root
