# The AI page: the question `patina install` asks after the bundles, asked here once so
# the first boot does not. Nothing is installed now: the answer goes to Global Storage
# (packagechooser_ai) and shellprocess-firstboot.conf writes it to
# /etc/patina/firstboot.env as PATINA_AI, which the first boot's `patina install` takes.
# The ids are the modes of manifest/bundles/ai-*.yaml (`ai`) plus none. assets.sh sets
# `default` from ai.mode of defaults/settings.yaml and renders the pictures
# (ai-<id>.png in the branding directory, where Calamares looks for them) from
# templates/calamares/ai.svg.
---
mode: required
method: legacy
labels:
  step: "AI agent"
  step[de]: "KI-Agent"
default: local   # filled from defaults/settings.yaml by assets.sh
items:
  - id: local
    name: "AI on this computer"
    name[de]: "KI auf diesem Computer"
    description: >-
      opencode with a model Ollama runs on this computer: private and free, nothing
      leaves the machine. Needs a few GB of disk and works best with 16 GB of memory.
      Ask it anything, let it change settings, write code or work on your servers;
      it asks before it changes anything.
    description[de]: >-
      opencode mit einem Modell, das Ollama auf diesem Computer ausführt: privat und
      frei, nichts verlässt das Gerät. Braucht einige GB Platz und läuft am besten mit
      16 GB Arbeitsspeicher. Frag es alles, lass es Einstellungen ändern, Code
      schreiben oder auf deinen Servern arbeiten; es fragt, bevor es etwas ändert.
    screenshot: ai-local.png
  - id: cloud
    name: "AI from a cloud provider"
    name[de]: "KI von einem Cloud-Anbieter"
    description: >-
      opencode with a model from a provider you pick at first boot, Mistral and other
      European providers first. Stronger and faster on small machines; needs an
      account and an API key, and what you ask leaves this computer. It asks before it
      changes anything.
    description[de]: >-
      opencode mit einem Modell eines Anbieters, den du beim ersten Start wählst,
      Mistral und andere europäische Anbieter zuerst. Stärker und schneller auf
      kleinen Geräten; braucht ein Konto und einen API-Schlüssel, und was du fragst,
      verlässt diesen Computer. Es fragt, bevor es etwas ändert.
    screenshot: ai-cloud.png
  - id: none
    name: "No AI agent"
    name[de]: "Kein KI-Agent"
    description: >-
      The desktop without an agent. `patina install` offers it again at any time.
    description[de]: >-
      Der Desktop ohne Agent. `patina install` bietet ihn jederzeit wieder an.
    screenshot: ai-none.png
