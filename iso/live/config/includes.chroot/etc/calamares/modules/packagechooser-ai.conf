# The AI page: the second half of the AI question `patina install` asks, where the
# agent's model runs, after the agent page (packagechooser-agent.conf). A Calamares page
# cannot be skipped (the sequence in settings.conf has no condition, and packagechooser
# no answer that hides the next page), so it shows after "No AI agent" too, its answer
# is ignored then, and each description says so first.
# Nothing is installed now: the answer goes to Global Storage (packagechooser_ai) and
# shellprocess-firstboot.conf writes it to /etc/patina/firstboot.env as PATINA_AI, which
# the first boot's `patina install` takes. The ids are the modes of manifest/bundles/
# (`ai`; lint checks that). assets.sh sets `default` from ai.mode of
# defaults/settings.yaml (local while that is none) and renders the pictures
# (ai-<id>.png in the branding directory, where Calamares looks for them) from
# templates/calamares/ai.svg.
---
mode: required
method: legacy
labels:
  step: "AI model"
  step[de]: "KI-Modell"
default: local    # filled from defaults/settings.yaml by assets.sh
items:
  - id: local
    name: "On this computer"
    name[de]: "Auf diesem Computer"
    description: >-
      Only for an agent picked on the page before: after "No AI agent", go on, this
      page changes nothing. A model Ollama runs on this computer: private and free,
      nothing leaves the machine. Needs a few GB of disk and works best with 16 GB of
      memory. The model it takes is a small one, made for agents, which gets commands
      and facts wrong more often: read what it proposes before you allow it. "patina
      install" offers a larger one later where the memory allows (20 GB and more).
    description[de]: >-
      Nur für einen auf der Seite davor gewählten Agenten: nach „Kein KI-Agent“ geht
      es einfach weiter, diese Seite ändert nichts. Ein Modell, das Ollama auf diesem
      Computer ausführt: privat und frei, nichts verlässt das Gerät. Braucht einige GB
      Platz und läuft am besten mit 16 GB Arbeitsspeicher. Es nimmt ein kleines, für
      Agenten gemachtes Modell, das sich bei Befehlen und Fakten öfter irrt: lies, was
      es vorschlägt, bevor du es erlaubst. „patina install“ bietet später ein größeres
      an, wo der Arbeitsspeicher reicht (ab 20 GB).
    screenshot: ai-local.png
  - id: cloud
    name: "From a cloud provider"
    name[de]: "Von einem Cloud-Anbieter"
    description: >-
      Only for an agent picked on the page before: after "No AI agent", go on, this
      page changes nothing. A model from a provider you pick at the first login, in
      the welcome: Mistral first, your own OpenAI-compatible API, or Big Pickle, free
      to try without a key. Stronger and faster on small machines; what you ask leaves
      this computer, and with a US provider (Big Pickle, Anthropic, OpenAI) the EU.
    description[de]: >-
      Nur für einen auf der Seite davor gewählten Agenten: nach „Kein KI-Agent“ geht
      es einfach weiter, diese Seite ändert nichts. Ein Modell eines Anbieters, den du
      bei der ersten Anmeldung im Willkommen wählst: Mistral zuerst, deine eigene
      OpenAI-kompatible API oder Big Pickle, ohne Schlüssel kostenlos zum Ausprobieren.
      Stärker und schneller auf kleinen Geräten; was du fragst, verlässt diesen
      Computer, und bei einem US-Anbieter (Big Pickle, Anthropic, OpenAI) die EU.
    screenshot: ai-cloud.png
