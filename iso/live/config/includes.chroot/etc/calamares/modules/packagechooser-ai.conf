# The AI page: the second half of the AI question `patina install` asks, where the
# agent's model runs, after the agent page (packagechooser-agent.conf). A Calamares page
# cannot be skipped, so it shows after "No AI agent" too, and its answer is ignored then.
# Nothing is installed now: the answer goes to Global Storage (packagechooser_ai) and
# shellprocess-firstboot.conf writes it to /etc/patina/firstboot.env as PATINA_AI, which
# the first boot's `patina install` takes. The ids are the modes of manifest/bundles/
# (`ai`; lint checks that). assets.sh sets `default` from ai.mode of
# defaults/settings.yaml (local while that is none) and renders the pictures
# (ai-<id>.png in the branding directory, where Calamares looks for them) from
# templates/calamares/ai.svg.
---
mode: required
method: legacy
labels:
  step: "AI model"
  step[de]: "KI-Modell"
default: local    # filled from defaults/settings.yaml by assets.sh
items:
  - id: local
    name: "On this computer"
    name[de]: "Auf diesem Computer"
    description: >-
      A model Ollama runs on this computer: private and free, nothing leaves the
      machine. Needs a few GB of disk and works best with 16 GB of memory. Without an
      agent this answer is ignored.
    description[de]: >-
      Ein Modell, das Ollama auf diesem Computer ausführt: privat und frei, nichts
      verlässt das Gerät. Braucht einige GB Platz und läuft am besten mit 16 GB
      Arbeitsspeicher. Ohne Agent wird diese Antwort ignoriert.
    screenshot: ai-local.png
  - id: cloud
    name: "From a cloud provider"
    name[de]: "Von einem Cloud-Anbieter"
    description: >-
      A model from a provider you pick at first boot, Mistral first. Stronger and
      faster on small machines; needs an account and an API key, and what you ask
      leaves this computer. Without an agent this answer is ignored.
    description[de]: >-
      Ein Modell eines Anbieters, den du beim ersten Start wählst, Mistral zuerst.
      Stärker und schneller auf kleinen Geräten; braucht ein Konto und einen
      API-Schlüssel, und was du fragst, verlässt diesen Computer. Ohne Agent wird diese
      Antwort ignoriert.
    screenshot: ai-cloud.png
