# SDDM with the Plasma Wayland session, as Debian's Plasma installs it. The automatic
# login (the users page's checkbox) goes to /etc/sddm.conf.d/kde_settings.conf, where
# Plasma's Login Screen settings keep it on Path A too, not to /etc/sddm.conf, which
# SDDM reads after every drop-in: so a device's drop-in (devices/*/system/sddm.conf.d/)
# can still choose the session. shellprocess-sddm.conf makes the directory.
---
displaymanagers:
  - sddm
defaultDesktopEnvironment:
  executable: startplasma-wayland
  desktopFile: plasma
basicSetup: false
sysconfigSetup: false
sddm:
  configuration_file: /etc/sddm.conf.d/kde_settings.conf
