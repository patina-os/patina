# Runs on the live system before the initramfs and GRUB's menu are made: the boot files
# of a laptop that boots with a device tree, where the boot menu's entry named one
# (device-boot.sh says why); on any other machine it does nothing. ${ROOT} is the
# target's root.
---
dontChroot: true
timeout: 30
script:
  - /etc/calamares/device-boot.sh "${ROOT}"
