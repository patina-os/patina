# Runs in the installed system after the bootloader step: the removable path
# (EFI/BOOT/BOOT<arch>.EFI), which firmware boots when its boot entries are lost, gets
# shim and the signed GRUB beside it, so such a machine still boots, with Secure Boot or
# without. It is Debian's own option, grub2/force_efi_extra_removable, the one its
# installer offers: set here, the maintainer scripts of shim-signed and grub-efi-<arch>
# keep that copy updated as well. grub-install takes the target, the ESP and the id
# (GRUB_DISTRIBUTOR: debian) from the system, so nothing here names an architecture.
# Only where the path is free or holds patina's shim already: on a partition shared with
# another system the loader there is that system's (Windows keeps a copy of its own),
# so it stays, and the setting is off, or every update of shim and GRUB would replace it.
---
dontChroot: false
timeout: 120
script:
  - >-
    other=no;
    for f in $(find /boot/efi/EFI/BOOT -maxdepth 1 -iname 'boot*.efi' 2> /dev/null); do
    cmp -s "$f" /boot/efi/EFI/debian/shim*.efi || other=yes; done;
    if [ "$other" = yes ]; then
    echo "patina grub2/force_efi_extra_removable boolean false" | debconf-set-selections;
    else
    echo "patina grub2/force_efi_extra_removable boolean true" | debconf-set-selections &&
    grub-install --force-extra-removable --no-nvram; fi
