# Runs on the live system after the bootloader step: shim at the removable path of the
# EFI system partition, where it is free or holds patina's shim already
# (efi-removable.sh says why). ${ROOT} is the target's root.
---
dontChroot: true
timeout: 120
script:
  - /etc/calamares/efi-removable.sh "${ROOT}"
