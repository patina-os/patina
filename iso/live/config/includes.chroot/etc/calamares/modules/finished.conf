# The last page: Done restarts into the new system, and the first boot takes it from
# there. The live system has no desktop to stay in (leaving the installer only brings it
# back), so the restart box is checked and cannot be unchecked; Calamares itself never
# restarts after a failed install. Its sentence about a live environment is Calamares'
# own text and stays.
---
restartNowMode: always
restartNowCommand: systemctl -i reboot
notifyOnFinished: false
