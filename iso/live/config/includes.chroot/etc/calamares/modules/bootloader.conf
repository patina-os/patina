# GRUB on UEFI. Debian's grub-install uses the signed shim and GRUB images when the
# *-signed packages are installed (iso/live/arch/), so Secure Boot keeps working.
# The directory on the ESP is Debian's own, EFI/debian: the signed GRUB looks for its
# configuration there, and shim-signed and grub-efi-<arch> (iso/live/arch/) re-run
# grub-install into it when they are upgraded, so the ESP gets their security updates.
# Calamares' fallback copy is off: it would put the GRUB image, which only Debian signs,
# at the removable path, where firmware with Microsoft's keys alone refuses it. The
# removable path gets shim instead (shellprocess-efi-removable.conf).
---
efiBootLoader: grub
efiBootloaderId: debian
grubInstall: grub-install
grubMkconfig: grub-mkconfig
grubCfg: /boot/grub/grub.cfg
grubProbe: grub-probe
efiBootMgr: efibootmgr
installEFIFallback: false
