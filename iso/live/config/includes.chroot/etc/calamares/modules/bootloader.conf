# GRUB on UEFI. Debian's grub-install uses the signed shim and GRUB images when the
# *-signed packages are installed (iso/live/arch/), so Secure Boot keeps working.
---
efiBootLoader: grub
grubInstall: grub-install
grubMkconfig: grub-mkconfig
grubCfg: /boot/grub/grub.cfg
grubProbe: grub-probe
efiBootMgr: efibootmgr
installEFIFallback: true
