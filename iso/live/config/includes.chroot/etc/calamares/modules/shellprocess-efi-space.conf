# Runs on the live system right after the mount step, before anything is copied: stops
# the install at once, with a message that says why, when the EFI system partition has
# no room for the boot loader or none is set for /boot/efi (efi-space.sh), instead of
# at the bootloader step an hour later. ${ROOT} is the target's root.
---
dontChroot: true
timeout: 30
script:
  - /etc/calamares/efi-space.sh "${ROOT}"
