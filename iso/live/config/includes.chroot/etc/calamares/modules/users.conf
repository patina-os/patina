# User page: one account in the sudo group, no root password (Debian's own default when
# a user is created), hostname derived from the user's name.
---
defaultGroups:
  - users
  - audio
  - video
  - netdev
  - plugdev
  - cdrom
  - dip
  - name: sudo
    must_exist: true
autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
sudoersConfigureWithGroup: true
setRootPassword: false
doReusePassword: true
passwordRequirements:
  minLength: 8
allowWeakPasswords: true
allowWeakPasswordsDefault: false
user:
  shell: /bin/bash
  forbidden_names:
    - root
    - live
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "${first}-${product}"
