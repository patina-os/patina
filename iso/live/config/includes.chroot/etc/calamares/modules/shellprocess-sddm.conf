# Runs in the installed system after the packages are in, before the displaymanager
# step: the directory SDDM reads its drop-ins from, which no package creates. The
# displaymanager step writes the automatic login there (displaymanager.conf), and
# `patina install` its own files beside it at first boot.
---
dontChroot: false
timeout: 10
script:
  - mkdir -p /etc/sddm.conf.d
