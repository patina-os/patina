# The apps page: the first half of the bundle question `patina install` asks, asked here
# once so the first boot does not. Nothing is installed now: the answer goes to Global
# Storage (packagechooser_apps), and shellprocess-firstboot.conf writes it, with the
# more-apps page's, to /etc/patina/firstboot.env as PATINA_BUNDLES, which the first
# boot hands to `patina install --bundles`. The ids are bundles of manifest/bundles/
# (lint checks that); assets.sh sets `default` from the bundle marked default and draws
# the pictures (bundle-<id>.png) from templates/calamares/bundle.svg.
---
mode: required
method: legacy
labels:
  step: "Apps"
  step[de]: "Apps"
default: desktop    # filled from manifest/bundles/ by assets.sh
items:
  - id: desktop
    name: "Standard"
    name[de]: "Standard"
    description: >-
      One good, free app for every everyday job: Firefox ESR, Thunderbird, Nextcloud,
      Euro-Office, KeePassXC and Element, Okular, Gwenview and Haruna for PDFs, photos
      and video, and kitty with the developer tools in the terminal.
    description[de]: >-
      Eine gute, freie App für jede Alltagsaufgabe: Firefox ESR, Thunderbird, Nextcloud,
      Euro-Office, KeePassXC und Element, Okular, Gwenview und Haruna für PDFs, Fotos
      und Videos, dazu kitty mit den Entwicklerwerkzeugen im Terminal.
    screenshot: bundle-desktop.png
  - id: minimal
    name: "Minimal"
    name[de]: "Minimal"
    description: >-
      Only kitty and Firefox ESR, with patina's look and system tuning. "patina install"
      adds the other apps at any time.
    description[de]: >-
      Nur kitty und Firefox ESR, mit dem Aussehen und der Systemabstimmung von patina.
      „patina install“ fügt die übrigen Apps jederzeit hinzu.
    screenshot: bundle-minimal.png
