# Runs in the installed system before the packages step, so its six apt runs (Plasma and
# the base bundle, about a thousand packages) do no work twice: dpkg stops syncing every
# file it writes (an install that breaks halfway is redone anyway; the end step syncs
# once), the initramfs, which each run that touched plymouth, firmware or the live
# tooling rebuilt, is left to the initramfs step after them, whose update-initramfs -c
# this setting does not stop, and man-db's index, which each run rebuilt, to man-db's
# daily timer (its postinst follows the debconf answer, the trigger the file). It also
# pins out Recommends of Plasma's that patina does not use, which only add files to
# unpack: the English speech-recognition model (libpocketsphinx3's; FFmpeg's libraries
# need the library, not the model) and KDE's handbooks with the Help Center (measured
# in November 2026: 44 MB of the step's 1 GB). The pin lasts only for the install,
# so either can be installed later. shellprocess-packages-end.conf undoes all of it.
# A leading - ignores a command's failure: on a system without man-db there is
# nothing to switch off.
---
dontChroot: false
timeout: 30
script:
  - echo force-unsafe-io > /etc/dpkg/dpkg.cfg.d/patina-install
  - sed -i 's/^update_initramfs=.*/update_initramfs=no/' /etc/initramfs-tools/update-initramfs.conf
  - echo "man-db man-db/auto-update boolean false" | debconf-set-selections
  - -rm -f /var/lib/man-db/auto-update
  - >-
    printf 'Package: %s\nPin: release *\nPin-Priority: -1\n\n'
    pocketsphinx-en-us khelpcenter khelpcenter-data dolphin-doc konqueror-doc
    plasma-desktop-doc plasma-workspace-doc libkf6userfeedback-doc bup-doc
    > /etc/apt/preferences.d/patina-install
