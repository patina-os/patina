# The theme page: the theme question `patina install` asks, asked here once. The answer
# goes to Global Storage (packagechooser_theme), and shellprocess-firstboot.conf writes
# it to /etc/patina/firstboot.env as PATINA_THEME. assets.sh fills `items` from
# themes/ (name, display_name, description) and `default` from defaults/settings.yaml,
# and draws each theme's picture (theme-<name>.png) from templates/calamares/theme.svg
# with that theme's palette and first wallpaper. The installer itself stays in the
# default theme's colours.
---
mode: required
method: legacy
labels:
  step: "Theme"
  step[de]: "Design"
default: aurora    # filled from defaults/settings.yaml by assets.sh
items: []          # filled from themes/ by assets.sh
