# Mount the new system for the steps that run inside it. Debian's calamares package
# ships no module configuration (calamares-settings-debian does, and is not used here),
# so without this file the target gets no /proc, /sys, /dev or /run: apt, update-initramfs,
# grub-install and efibootmgr then run in a chroot without them. Calamares 3.3.14's
# example configuration, with the ESP readable by root only as Debian's installer sets it.
---
extraMounts:
  - device: proc
    fs: proc
    mountPoint: /proc
  - device: sys
    fs: sysfs
    mountPoint: /sys
  - device: /dev
    mountPoint: /dev
    options: [bind]
  - device: tmpfs
    fs: tmpfs
    mountPoint: /run
  - device: /run/udev
    mountPoint: /run/udev
    options: [bind]
  - device: efivarfs
    fs: efivarfs
    mountPoint: /sys/firmware/efi/efivars
    efi: true
mountOptions:
  - filesystem: default
    options: [defaults]
  - filesystem: efi
    options: [defaults, umask=0077]
