# What the installer fetches from Debian's mirrors into the target system, and what it
# removes from it afterwards (the live tooling and the installer itself). The install
# list covers Plasma and manifest/bundles/base.yaml; CI checks that every package of the
# base bundle is here. Everything else (app bundles, Flathub, agent tools) is Path A's
# job on first boot, so an old image still installs today's layer.
---
backend: apt
update_db: true
update_system: false
skip_if_no_internet: false

operations:
  # Several installs instead of one, smallest first: Calamares moves its progress bar
  # and names the step after each operation (by its share of the packages), and apt
  # shows nothing while it runs, so one long list looked stuck for half an hour.
  - install:
      # manifest/bundles/base.yaml: what `patina` needs on first boot
      - git
      - curl
      - ca-certificates
      - sudo
      - flatpak
      - systemd-zram-generator
      - systemd-oomd
      - irqbalance
      - librsvg2-bin
      - gum                  # the install TUI at first boot (manifest/bundles/base.yaml)
      - util-linux-extra     # hwclock, which the hwclock step after this one runs
  - install:
      # the look: the layer's fonts (defaults/settings.yaml) and the wordmark's, so the
      # first login and the first-boot screen already have them, and the icons
      - fonts-noto
      - fonts-noto-mono
      - fonts-adobe-sourcesans3
      - fonts-jetbrains-mono
      - fonts-sora
      - papirus-icon-theme   # the look (manifest/bundles/base.yaml)
  - install:
      # the full firmware set, which the live image carries only part of
      - firmware-linux
  - install:
      # Plasma as Debian packages it: the minimal desktop and its login screen, the
      # largest download
      - kde-plasma-desktop
      - sddm
      - kwin-wayland
  - install:
      # the pieces a laptop needs, and the start menu's dashboard (base.yaml)
      - plasma-nm
      - plasma-pa
      - pipewire-audio
      - kscreen
      - powerdevil
      - bluedevil
      - plasma-discover
      - plasma-discover-backend-flatpak
      - xdg-desktop-portal-kde
      - kde-config-gtk-style
      - breeze-gtk-theme
      - plasma-widgets-addons
  - remove:
      - calamares
      - live-boot
      - live-boot-initramfs-tools
      - live-config
      - live-config-systemd
      - openbox
      - xinit
      - xterm
