# What the installer fetches from Debian's mirrors into the target system, and what it
# removes from it afterwards (the live tooling and the installer itself). The install
# list covers Plasma and manifest/bundles/base.yaml; CI checks that every package of the
# base bundle is here. Everything else (app bundles, Flathub, agent tools) is Path A's
# job on first boot, so an old image still installs today's layer.
---
backend: apt
update_db: true
update_system: false
skip_if_no_internet: false

operations:
  - install:
      # Plasma as Debian packages it: the minimal desktop plus the pieces a laptop needs
      - kde-plasma-desktop
      - sddm
      - kwin-wayland
      - plasma-nm
      - plasma-pa
      - pipewire-audio
      - kscreen
      - powerdevil
      - bluedevil
      - plasma-discover
      - plasma-discover-backend-flatpak
      - xdg-desktop-portal-kde
      - kde-config-gtk-style
      - breeze-gtk-theme
      - fonts-noto
      - fonts-noto-mono
      # the full firmware set, which the live image carries only part of
      - firmware-linux
      # manifest/bundles/base.yaml: what `patina` needs on first boot
      - git
      - curl
      - ca-certificates
      - sudo
      - flatpak
  - remove:
      - calamares
      - live-boot
      - live-boot-initramfs-tools
      - live-config
      - live-config-systemd
      - openbox
      - xinit
