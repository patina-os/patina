# Runs in the installed system after the packages step: undoes
# shellprocess-packages-start.conf, so the installed system's dpkg, initramfs and
# man-db work as Debian's do, and writes to disk once what dpkg left unsynced.
---
dontChroot: false
timeout: 300
script:
  - rm -f /etc/dpkg/dpkg.cfg.d/patina-install
  - sed -i 's/^update_initramfs=.*/update_initramfs=yes/' /etc/initramfs-tools/update-initramfs.conf
  - echo "man-db man-db/auto-update boolean true" | debconf-set-selections
  - -test ! -d /var/lib/man-db || touch /var/lib/man-db/auto-update
  - sync
