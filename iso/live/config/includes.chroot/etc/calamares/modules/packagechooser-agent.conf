# The agent page: the first half of the AI question `patina install` asks, asked here
# once so the first boot does not; the AI page (packagechooser-ai.conf) asks the second,
# where its model runs. Nothing is installed now: the answer goes to Global Storage
# (packagechooser_agent) and shellprocess-firstboot.conf writes it to
# /etc/patina/firstboot.env as PATINA_AI_AGENT, which the first boot's `patina install`
# takes; none there means no agent, whatever the AI page says. The ids are the agents of
# manifest/bundles/ (`agent`, opencode when absent) plus none (lint checks that).
# assets.sh sets `default` from ai.agent and ai.mode of defaults/settings.yaml and
# renders the pictures (agent-<id>.png) from templates/calamares/ai.svg.
---
mode: required
method: legacy
labels:
  step: "AI agent"
  step[de]: "KI-Agent"
default: none    # filled from defaults/settings.yaml by assets.sh
items:
  - id: opencode
    name: "opencode"
    name[de]: "opencode"
    description: >-
      Free. Asks before every change, so you allow each step. Each conversation starts
      fresh.
    description[de]: >-
      Frei. Fragt vor jeder Änderung, du erlaubst also jeden Schritt. Jedes Gespräch
      beginnt neu.
    screenshot: agent-opencode.png
  - id: hermes
    name: "Hermes Agent"
    name[de]: "Hermes Agent"
    description: >-
      Free, from Nous Research. Remembers you across conversations and gets on with the
      work; asks only before a dangerous command.
    description[de]: >-
      Frei, von Nous Research. Merkt sich dich über Gespräche hinweg und erledigt die
      Arbeit; fragt nur vor einem gefährlichen Befehl.
    screenshot: agent-hermes.png
  - id: none
    name: "No AI agent"
    name[de]: "Kein KI-Agent"
    description: >-
      "patina ai on" turns one on at any time.
    description[de]: >-
      „patina ai on“ schaltet jederzeit einen ein.
    screenshot: agent-none.png
