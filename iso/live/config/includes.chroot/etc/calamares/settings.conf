# Calamares configuration for the patina live image. Installer data only: which pages
# the user sees and which steps run. Everything installed comes from Debian's archive
# (modules/packages.conf); the first boot runs Path A (modules/shellprocess-firstboot.conf)
# with the answers of the agent, AI, apps, more-apps and theme pages
# (modules/packagechooser-*.conf), so it asks nothing more, except a cloud agent's
# provider and key.
---
modules-search: [local]

instances:
  - id: firstboot
    module: shellprocess
    config: shellprocess-firstboot.conf
  - id: efi-removable
    module: shellprocess
    config: shellprocess-efi-removable.conf
  - id: agent
    module: packagechooser
    config: packagechooser-agent.conf
  - id: ai
    module: packagechooser
    config: packagechooser-ai.conf
  - id: apps
    module: packagechooser
    config: packagechooser-apps.conf
  - id: more
    module: packagechooser
    config: packagechooser-more.conf
  - id: theme
    module: packagechooser
    config: packagechooser-theme.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - packagechooser@agent
      - packagechooser@ai
      - packagechooser@apps
      - packagechooser@more
      - packagechooser@theme
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - networkcfg
      - packages
      # after the packages: SDDM and hwclock (util-linux-extra) are fetched by them
      - displaymanager
      - hwclock
      - shellprocess@firstboot
      - luksbootkeyfile
      - initramfscfg
      - initramfs
      - grubcfg
      - bootloader
      - shellprocess@efi-removable
      - umount
  - show:
      - finished

branding: patina
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
