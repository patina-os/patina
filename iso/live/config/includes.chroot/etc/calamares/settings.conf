# Calamares configuration for the patina21 live image. Installer data only: which pages
# the user sees and which steps run. Everything installed comes from Debian's archive
# (modules/packages.conf); the first boot runs Path A (modules/shellprocess-firstboot.conf).
---
modules-search: [local]

instances:
  - id: firstboot
    module: shellprocess
    config: shellprocess-firstboot.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - packages
      - shellprocess@firstboot
      - luksbootkeyfile
      - initramfscfg
      - initramfs
      - grubcfg
      - bootloader
      - umount
  - show:
      - finished

branding: patina21
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
