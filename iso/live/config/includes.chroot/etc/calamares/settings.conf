# Calamares configuration for the patina live image. Installer data only: which pages
# the user sees and which steps run. Everything installed comes from Debian's archive
# (modules/packages.conf); the first boot runs Path A (modules/shellprocess-firstboot.conf)
# with the answers of the agent, AI, apps, more-apps and theme pages
# (modules/packagechooser-*.conf), so it asks nothing more, except the user's password
# for sudo, as Path A does. A cloud agent's provider and key are the welcome's, at the
# first login (patina ai login).
---
modules-search: [local]

instances:
  - id: firstboot
    module: shellprocess
    config: shellprocess-firstboot.conf
  - id: efi-removable
    module: shellprocess
    config: shellprocess-efi-removable.conf
  - id: sddm
    module: shellprocess
    config: shellprocess-sddm.conf
  - id: efi-space
    module: shellprocess
    config: shellprocess-efi-space.conf
  - id: efi-fstab
    module: shellprocess
    config: shellprocess-efi-fstab.conf
  - id: packages-start
    module: shellprocess
    config: shellprocess-packages-start.conf
  - id: packages-end
    module: shellprocess
    config: shellprocess-packages-end.conf
  - id: agent
    module: packagechooser
    config: packagechooser-agent.conf
  - id: ai
    module: packagechooser
    config: packagechooser-ai.conf
  - id: apps
    module: packagechooser
    config: packagechooser-apps.conf
  - id: more
    module: packagechooser
    config: packagechooser-more.conf
  - id: theme
    module: packagechooser
    config: packagechooser-theme.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - packagechooser@agent
      - packagechooser@ai
      - packagechooser@apps
      - packagechooser@more
      - packagechooser@theme
      - summary
  - exec:
      - partition
      - mount
      # room for the boot loader, checked before anything is copied; an EFI partition
      # with room in place of a full one
      - shellprocess@efi-space
      - unpackfs
      - machineid
      - fstab
      # the EFI partition efi-space mounted, where it swapped one
      - shellprocess@efi-fstab
      - locale
      - keyboard
      - localecfg
      - users
      - networkcfg
      # the package step without its repeated work (shellprocess-packages-start.conf)
      - shellprocess@packages-start
      - packages
      - shellprocess@packages-end
      # after the packages: SDDM and hwclock (util-linux-extra) are fetched by them
      - shellprocess@sddm
      - displaymanager
      - hwclock
      - shellprocess@firstboot
      - luksbootkeyfile
      - initramfscfg
      - initramfs
      - grubcfg
      - bootloader
      - shellprocess@efi-removable
      - umount
  - show:
      - finished

branding: patina
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
