# Calamares configuration for the patina live image. Installer data only: which pages
# the user sees and which steps run. Everything installed comes from Debian's archive
# (modules/packages.conf); the first boot runs Path A (modules/shellprocess-firstboot.conf)
# with the answer of the AI page (modules/packagechooser-ai.conf).
---
modules-search: [local]

instances:
  - id: firstboot
    module: shellprocess
    config: shellprocess-firstboot.conf
  - id: efi-removable
    module: shellprocess
    config: shellprocess-efi-removable.conf
  - id: ai
    module: packagechooser
    config: packagechooser-ai.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - packagechooser@ai
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - packages
      - shellprocess@firstboot
      - luksbootkeyfile
      - initramfscfg
      - initramfs
      - grubcfg
      - bootloader
      - shellprocess@efi-removable
      - umount
  - show:
      - finished

branding: patina
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
