# Agama product definition for the patina21 ISO. This is installer data, not a product
# of our own: every repository below is openSUSE Tumbleweed's, the patterns and packages
# are openSUSE's, and `base_product: openSUSE` keeps openSUSE's release package. The
# only patina21 content is the name the installer shows and the choice of what to
# preselect (Plasma, free software only). Modelled on agama-products-opensuse's
# tumbleweed.yaml; verify against it when Agama changes its product schema.
id: patina21
name: patina21 (openSUSE Tumbleweed)
# Agama's neutral product icon. No geeko: see docs/branding.md.
icon: default.svg
description: >-
  openSUSE Tumbleweed with KDE Plasma, finished by patina21 on first boot: one theme
  across the desktop, curated defaults, the agent CLIs and a free-software app stack.
  Installs only from openSUSE's own repositories.

software:
  # oss and update only. The non-oss repository is deliberately absent: free software
  # only (README, "The stance"). x86_64 and aarch64 are the two architectures the
  # layer targets; add others only with a row in docs/hardware.md.
  installation_repositories:
    - url: https://download.opensuse.org/tumbleweed/repo/oss/
      archs: x86_64
    - url: https://download.opensuse.org/update/tumbleweed/
      archs: x86_64
    - url: https://download.opensuse.org/ports/aarch64/tumbleweed/repo/oss/
      archs: aarch64
    - url: https://download.opensuse.org/ports/aarch64/update/tumbleweed/
      archs: aarch64
  mandatory_patterns:
    - enhanced_base
    - kde            # Plasma is the decision; no desktop chooser in the installer
  optional_patterns: []
  user_patterns:
    - name: selinux  # Tumbleweed's default since 2025
      selected: true
    - apparmor
  # Mirror of manifest/bundles/base.yaml: what `patina` itself needs on first boot.
  # Keep the two lists identical; CI compares them.
  mandatory_packages:
    - NetworkManager
    - openSUSE-repos-Tumbleweed
    - sudo-policy-wheel-auth-self
    - git
    - yq
    - flatpak
    - curl
  optional_packages:
    - os-prober
  base_product: openSUSE

boot:
  default_efi_bootloader: "systemd-boot"   # Tumbleweed's own default; signed via shim

# Tumbleweed's storage policy, unchanged: btrfs with snapshots, so `patina update` is
# always one rollback away from undone.
storage:
  space_policy: delete
  volumes:
    - "/"
    - "swap"
  volume_templates:
    - mount_path: "/"
      filesystem: btrfs
      btrfs:
        snapshots: true
        read_only: false
        default_subvolume: "@"
        subvolumes:
          - path: home
          - path: opt
          - path: root
          - path: srv
          - path: usr/local
          - path: var
            copy_on_write: false
      size:
        auto: true
      outline:
        required: true
        filesystems:
          - btrfs
          - ext4
          - xfs
        auto_size:
          base_min: 5 GiB
          base_max: 15 GiB
          snapshots_increment: 250%
          max_fallback_for:
            - "/home"
        snapshots_configurable: true
    - mount_path: "swap"
      filesystem: swap
      size:
        min: 1 GiB
        max: 2 GiB
      outline:
        required: false
