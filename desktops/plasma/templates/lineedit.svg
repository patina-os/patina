<svg xmlns="http://www.w3.org/2000/svg" width="20" height="80" viewBox="0 0 20 80">
 <!-- patina: Plasma's text fields (the search fields of the start menu, the command
      palette and the other popups), in place of Breeze's widgets/lineedit: a veil of
      the text colour with no edge, which a thin edge of the accent outlines under the
      pointer (hover) and while typing (focus), drawn over the veil. The frames Plasma
      stretches; the margins keep Breeze's 6 px round the words. Rendered at apply time
      from start_menu.search. -->
 <style id="current-color-scheme" type="text/css">.ColorScheme-Text { color: ${BASE05}; } .ColorScheme-ViewFocus { color: ${ACCENT}; }</style>
