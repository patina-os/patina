# patina21 agent profile: the ${DISPLAY_NAME} theme in a quieter window for the agent
# CLI (${AGENT}), opened by the `agent` keybinding. Overwritten by `patina theme set`.
include patina21.conf

background ${BASE01}
cursor ${BASE0F}
cursor_shape beam
window_padding_width 14
tab_bar_style hidden
remember_window_size no
initial_window_width 120c
initial_window_height 40c
