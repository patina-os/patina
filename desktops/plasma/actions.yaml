# How the Plasma renderer binds the actions of defaults/keybindings.yaml, as data read by
# apply.sh. Each action is one of:
#   service: a .desktop file; the chord becomes its _launch shortcut in kglobalshortcutsrc.
#            The value default-web-browser resolves through `xdg-settings`. A service
#            whose desktop file is not installed is warned about and skipped.
#   component + key: a kglobalaccel component (kwin, ksmserver, plasmashell) and the
#            action key in that component. `default` is Plasma's own chord, kept in the
#            reset-to-default field; `label` is the friendly name Plasma shows.
# An action of defaults/keybindings.yaml that is missing here is warned about, not fatal.
actions:
  terminal:
    service: kitty.desktop
    label: kitty
  launcher:
    service: org.kde.krunner.desktop
    label: KRunner
  browser:
    service: default-web-browser
    label: Web Browser
  files:
    service: org.kde.dolphin.desktop
    label: Dolphin
  screenshot:
    service: org.kde.spectacle.desktop
    label: Spectacle
  agent:
    # apply.sh writes this desktop file when the agents bundle is installed; otherwise
    # the action is skipped.
    service: patina-agent.desktop
    label: Agent
  keys:
    # apply.sh writes this desktop file: kitty showing `patina keys`.
    service: patina-keys.desktop
    label: patina keys
  close-window:
    component: kwin
    key: Window Close
    default: Alt+F4
    label: Close Window
  overview:
    component: kwin
    key: Overview
    default: Meta+W
    label: Toggle Overview
  lock-screen:
    component: ksmserver
    key: Lock Session
    default: Meta+L
    label: Lock Session

# Plasma defaults that use a chord the curated keybindings take; they are set to none.
unbind:
  - component: plasmashell
    key: manage activities
    default: Meta+Q
    label: Show Activity Switcher
  - component: plasmashell
    key: next activity
    default: Meta+Tab
    label: Walk through activities

# Plasma's own chords worth knowing, for the cheat sheet (`patina keys`, Meta+K): the
# defaults of Plasma 6 that patina leaves as they are. Words only; nothing is bound here.
cheatsheet:
  - {chord: "Meta", name: "Open the application menu"}
  - {chord: "Alt+Tab", name: "Switch between windows"}
  - {chord: "Meta+Left / Meta+Right", name: "Tile the window to the left or right half"}
  - {chord: "Meta+Up / Meta+Down", name: "Tile the window to the top or bottom half"}
  - {chord: "Meta+PgUp", name: "Maximise the window"}
  - {chord: "Meta+PgDown", name: "Minimise the window"}
  - {chord: "Meta+T", name: "Edit the window tiles"}
  - {chord: "Meta+D", name: "Peek at the desktop"}
  - {chord: "Ctrl+Meta+Left / Ctrl+Meta+Right", name: "Switch to the desktop on the left or right"}
  - {chord: "Meta+V", name: "Clipboard history"}
  - {chord: "Meta+.", name: "Emoji"}
  - {chord: "Meta+P", name: "Switch displays"}
  - {chord: "Meta+Shift+Print", name: "Screenshot of a region"}
  - {chord: "Ctrl+Esc", name: "System monitor"}
  - {chord: "Ctrl+Alt+Del", name: "Log out, restart or shut down"}
