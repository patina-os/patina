# patina: the session's environment for the terminal tools, read by systemd's user
# manager at login. ~/.local/bin, where `patina` and the tools it fetches live, is on
# the PATH of every app of the session. fzf and bat draw with the terminal's colours,
# which kitty takes from the theme: fzf's sixteen-colour scheme, and bat's base16 theme
# for git-delta. Written by `patina theme set` while this first line stays; remove it to
# keep your own.
PATH=$HOME/.local/bin:$PATH
FZF_DEFAULT_OPTS=--color=16
BAT_THEME=base16-256
