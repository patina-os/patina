# patina: the ${DISPLAY_NAME} theme's colours, the default fonts and the window's
# padding, included by kitty.conf. `patina theme set` overwrites this file; keep your
# own settings in kitty.conf below the include line.
font_family ${MONO_FONT}
font_size 10.0
window_padding_width 10
# the size of a new window is the desktop's (windows.size of defaults/settings.yaml)
remember_window_size no
# the one see-through window: the background only, the text stays opaque
background_opacity 0.95

foreground ${BASE05}
background ${BASE00}
selection_foreground ${BASE00}
selection_background ${ACCENT}
cursor ${ACCENT}
cursor_text_color ${BASE00}
url_color ${BASE0D}

active_border_color ${ACCENT}
inactive_border_color ${BASE02}
bell_border_color ${BASE09}

active_tab_foreground ${ACCENT}
active_tab_background ${BASE02}
inactive_tab_foreground ${BASE04}
inactive_tab_background ${BASE01}
tab_bar_background ${BASE01}

mark1_foreground ${BASE00}
mark1_background ${ACCENT_ALT}

# black
color0 ${BASE00}
color8 ${BASE03}
# red
color1 ${BASE08}
color9 ${BASE08}
# green
color2 ${BASE0B}
color10 ${BASE0B}
# yellow
color3 ${BASE0A}
color11 ${BASE0A}
# blue
color4 ${BASE0D}
color12 ${BASE0D}
# magenta
color5 ${BASE0E}
color13 ${BASE0E}
# cyan
color6 ${BASE0C}
color14 ${BASE0C}
# white
color7 ${BASE05}
color15 ${BASE07}
# the base16 extras
color16 ${BASE09}
color17 ${BASE0F}
color18 ${BASE01}
color19 ${BASE02}
color20 ${BASE04}
color21 ${BASE06}
