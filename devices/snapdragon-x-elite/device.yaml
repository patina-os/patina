# Snapdragon X Elite laptops (docs/roadmap.md, Phase 4). One directory for the platform:
# the laptops differ only in their device tree and firmware set, listed under `models`.
# The firmware helper the hardware list mentions is written only after a run shows which
# files Debian's archive lacks for a model.
name: Snapdragon X Elite laptops (Qualcomm X1E80100 and X1E78100)
slug: snapdragon-x-elite
arch: aarch64
status: untested
base_image: https://wiki.debian.org/InstallingDebianOn/Thinkpad/T14s_Gen6_Snapdragon
# Every device tree of the platform lists the SoC: the X1E78100's name it after their own.
detect_compatible: qcom,x1e80100
menu: Snapdragon X Elite laptops
# Named by the Debian wiki's T14s Gen 6 page (as of 2026-10-29); the other models are
# untested. The image's boot menu puts them on its entries' command lines, and
# system/default/grub.d/ repeats them for an installed system's GRUB; with systemd-boot
# they go into /etc/kernel/cmdline (README).
kernel_params:
  - clk_ignore_unused
  - deferred_probe_timeout=30
extra_packages:         # from Debian's non-free-firmware area, the only non-free content allowed
  - firmware-qcom-soc   # qcom/x1e80100/: GPU, DSP, battery manager and audio topology, per model
  - firmware-atheros    # ath12k/WCN7850/: the wifi and bluetooth chip these laptops share
# Device tree per model, as Debian's arm64 kernel ships it under
# /usr/lib/linux-image-<version>-arm64/. A model with `menu` has an entry of that name
# in the arm64 image's boot menu, which loads its device tree; only those whose
# firmware Debian carries. `smbios` is a regular expression for the product name the
# firmware reports (a Lenovo's begins with its machine type): where it matches, the
# entry leads the menu. All of them stand in a submenu named by the device's `menu`.
# The T14s Gen 6 (machine types 21N1 and 21N2) has one device tree per screen; both read
# their firmware from qcom/x1e80100/LENOVO/21N1/. The T14s Gen 7 is a Snapdragon X2.
models:
  - name: Lenovo ThinkPad T14s Gen 6, 1920x1200 LCD (21N1, 21N2)
    dtb: qcom/x1e78100-lenovo-thinkpad-t14s.dtb
    firmware_in_debian: true    # firmware-qcom-soc carries qcom/x1e80100/LENOVO/21N1/
    menu: ThinkPad T14s Gen 6 (LCD)
    smbios: ^21N[12]
  - name: Lenovo ThinkPad T14s Gen 6, 2880x1800 OLED (21N1, 21N2)
    dtb: qcom/x1e78100-lenovo-thinkpad-t14s-oled.dtb
    firmware_in_debian: true    # the same firmware as the LCD model
    menu: ThinkPad T14s Gen 6 (OLED)
    smbios: ^21N[12]
  - name: Lenovo Yoga Slim 7x (83ED)
    dtb: qcom/x1e80100-lenovo-yoga-slim7x.dtb
    firmware_in_debian: true    # firmware-qcom-soc carries qcom/x1e80100/LENOVO/83ED/
    menu: Yoga Slim 7x
    smbios: ^83ED
  - name: ASUS Vivobook S15
    dtb: qcom/x1e80100-asus-vivobook-s15.dtb
    firmware_in_debian: false
  - name: Dell XPS 13 9345
    dtb: qcom/x1e80100-dell-xps13-9345.dtb
    firmware_in_debian: false
  - name: HP OmniBook X 14
    dtb: qcom/x1e80100-hp-omnibook-x14.dtb
    firmware_in_debian: false
  - name: Microsoft Surface Laptop 7 (13 inch)
    dtb: qcom/x1e80100-microsoft-romulus13.dtb
    firmware_in_debian: false
  - name: Microsoft Surface Laptop 7 (15 inch)
    dtb: qcom/x1e80100-microsoft-romulus15.dtb
    firmware_in_debian: false
notes: >
  Boots Debian 13 with the kernel from trixie-backports (the Debian wiki documents a
  manual debootstrap plus systemd-boot install on the ThinkPad T14s Gen 6; Debian's
  installer does not boot here, because the firmware offers no usable ACPI tables and
  the device tree must be handed to the kernel by the boot loader, which the patina
  arm64 image's boot menu does for the models with `menu`, Secure Boot off). Upstream,
  NVMe, keyboard, touchpad, display including external outputs, GPU and wifi work;
  audio has no speaker protection; suspend drains the battery within a day; bluetooth
  and the camera still need an out-of-tree branch. Debian 13's own firmware package
  covers the T14s Gen 6 (either screen) and the Yoga Slim 7x; the others need firmware
  from the machine's Windows partition, which patina neither ships nor has a helper
  for yet.
