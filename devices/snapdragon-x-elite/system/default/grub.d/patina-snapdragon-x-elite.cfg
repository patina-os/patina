# patina: what the kernel needs on its command line on a Snapdragon X Elite laptop
# (kernel_params in devices/snapdragon-x-elite/device.yaml, from the Debian wiki's page
# for the ThinkPad T14s Gen 6), each once, on every entry, the recovery ones too.
# Source: devices/snapdragon-x-elite/system/ in the patina checkout; `patina install`
# writes it here on these laptops and runs update-grub.
for patina_word in clk_ignore_unused deferred_probe_timeout=30; do
  case " $GRUB_CMDLINE_LINUX " in
    *" $patina_word "*) ;;
    *) GRUB_CMDLINE_LINUX="${GRUB_CMDLINE_LINUX:+$GRUB_CMDLINE_LINUX }$patina_word" ;;
  esac
done
unset patina_word
