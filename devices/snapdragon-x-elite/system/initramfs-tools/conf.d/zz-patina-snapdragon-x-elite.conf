# patina: on a Snapdragon X Elite laptop the initramfs keeps Debian's full set of
# modules. patina's own setting (conf.d/patina.conf, MODULES=dep) takes only what the
# root's disk and its parents in sysfs need; here the disk also hangs on clocks, PHYs
# and regulators the device tree names, which that walk may miss, and a laptop that
# does not find its disk does not boot. A precaution until a run has tried MODULES=dep
# on one (docs/x-elite-run.md). The name sorts after patina.conf, so this one counts.
# Source: devices/snapdragon-x-elite/system/ in the patina checkout.
MODULES=most
