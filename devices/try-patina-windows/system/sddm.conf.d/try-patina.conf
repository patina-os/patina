# patina, on Try patina for Windows only (devices/try-patina-windows/): the login screen
# offers the Plasma X11 session first, because spice-vdagent shares the clipboard with
# Windows only there. SDDM reads its conf.d files in name order, so this file comes after
# patina.conf and its DefaultSession wins. Written by `patina install`; edits are
# overwritten.
[General]
DefaultSession=plasmax11.desktop
