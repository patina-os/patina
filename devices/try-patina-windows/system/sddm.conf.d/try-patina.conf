# patina, on Try patina for Windows only (devices/try-patina-windows/): the login screen
# offers the Plasma X11 session first, and logging in automatically starts it, because
# spice-vdagent shares the clipboard with Windows only there. SDDM reads its conf.d files
# in name order, so this file comes after kde_settings.conf (the automatic login, from
# the installer or Plasma's Login Screen settings) and patina.conf, and its sessions
# win. Written by `patina install`; edits are overwritten.
[General]
DefaultSession=plasmax11.desktop

[Autologin]
Session=plasmax11.desktop
