# Try patina for Windows: GRUB at the display's one resolution, 1920x1080, which the
# launcher gives QEMU's standard VGA (machine.go in patina-os/win-emulator) and its
# window scales. The firmware reports no preferred mode, so GRUB kept its 800x600 and
# the menu stood in a 4:3 box in the 16:9 window. The kernel keeps the mode, so the
# boot splash starts at it too; auto where the mode is missing.
GRUB_GFXMODE=1920x1080,auto
